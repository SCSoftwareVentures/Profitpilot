name: ProfitPilot CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - integration/pr25-pr26-validation
      - feature/job-readiness-engine
      - feature/promise-ledger
      - feature/verified-value-ledger
      - security/tenant-isolation-release-gate-20261118
  workflow_dispatch:
  schedule:
    - cron: "23 17 * * 2"

permissions:
  contents: read

concurrency:
  group: profitpilot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete reachable history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check source credentials and locked dependency integrity
        run: node scripts/source-security-preflight.js

      - name: Scan all fetched reachable Git history for credential shapes
        run: node scripts/scan-git-history.js

      - name: Verify reviewed migration and bootstrap inventory
        run: node scripts/verify-migration-inventory.js

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit resolved production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify OpenAPI YAML structure and reject duplicate mapping keys
        run: |
          ruby -rpsych -e '
            doc=Psych.parse_file("api/openapi.yaml")
            visit=lambda do |node|
              if node.is_a?(Psych::Nodes::Mapping)
                keys=node.children.each_slice(2).map { |k,v| k.value }
                abort "Duplicate OpenAPI mapping key" unless keys.uniq.length==keys.length
              end
              (node.children || []).each { |child| visit.call(child) }
            end
            visit.call(doc)
            spec=Psych.safe_load_file("api/openapi.yaml",aliases:false)
            abort "Missing OpenAPI root fields" unless %w[openapi info paths components].all? { |key| spec.key?(key) }
          '

      - name: Syntax checks
        run: npm run check

      - name: Unit tests
        run: npm test

  database:
    name: PostgreSQL migrations and tenant RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and start the remediated PostgreSQL image
        run: |
          set -eu
          docker build --pull -f database/Dockerfile.postgres -t profitpilot-postgres:ci database
          test "$(docker image inspect profitpilot-postgres:ci --format '{{len .RootFS.Layers}}')" = 1
          docker run -d --name profitpilot-postgres-ci -p 127.0.0.1:5432:5432 -e POSTGRES_DB=profitpilot -e POSTGRES_USER=profitpilot_admin -e POSTGRES_PASSWORD=ci-admin-password profitpilot-postgres:ci
          export PGPASSWORD=ci-admin-password
          for attempt in $(seq 1 45); do
            if psql -h 127.0.0.1 -U profitpilot_admin -d profitpilot -v ON_ERROR_STOP=1 -c 'SELECT 1' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          psql -h 127.0.0.1 -U profitpilot_admin -d profitpilot -v ON_ERROR_STOP=1 -c 'SELECT 1'
          docker exec profitpilot-postgres-ci sh -ec '
            test ! -e /usr/local/bin/gosu
            test ! -L /usr/local/bin/gosu
            test -x /sbin/su-exec
            test "$(su-exec postgres id -u)" = "$(id -u postgres)"
            test "$(su-exec postgres id -g)" = "$(id -g postgres)"
            test "$(id -u postgres)" != 0
            case " $(su-exec postgres id -G) " in *" 0 "*) exit 1;; esac
            test "$(awk "/^Uid:/ {print \$2}" /proc/1/status)" = "$(id -u postgres)"
            test "$(awk "/^Gid:/ {print \$2}" /proc/1/status)" = "$(id -g postgres)"
          '

      - name: Generate ephemeral tenant context signing key
        run: |
          TENANT_CONTEXT_HMAC_SECRET="$(openssl rand -hex 32)"
          POSTGRES_APP_PASSWORD="$(openssl rand -hex 32)"
          RATE_LIMIT_HASH_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$RATE_LIMIT_HASH_SECRET"
          echo "RATE_LIMIT_HASH_SECRET=$RATE_LIMIT_HASH_SECRET" >> "$GITHUB_ENV"
          echo "::add-mask::$TENANT_CONTEXT_HMAC_SECRET"
          echo "::add-mask::$POSTGRES_APP_PASSWORD"
          echo "TENANT_CONTEXT_HMAC_SECRET=$TENANT_CONTEXT_HMAC_SECRET" >> "$GITHUB_ENV"
          echo "POSTGRES_APP_PASSWORD=$POSTGRES_APP_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply schema, runtime role and migrations
        env:
          PGPASSWORD: ci-admin-password
        run: |
          DB_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
          POSTGRES_APP_PASSWORD="$POSTGRES_APP_PASSWORD" psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/init/002-runtime-role.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/002_tenant_rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/init/003-tenant-context-key.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/003_allocation_lines.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/004_import_validation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/005_prevent_duplicate_confirmations.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/006_tenant_actor_membership_fks.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/007_users_self_rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/008_runtime_least_privilege.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/009_import_metadata_status.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/010_payroll_source_row_ledger.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/011_payroll_confirmation_integrity.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/012_contract_tax_basis.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/013_actor_authorization.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/014_match_decision_audit.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/015_shared_rate_limits.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/016_tenant_key_lifecycle.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/017_invoice_import_privacy.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/018_import_disposal_controls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/019_calculation_export.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/020_private_file_quarantine.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/021_quarantine_scanner_lifecycle.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/022_quarantine_content_validation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/023_identity_session_revocation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/024_audit_chain_integrity.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/025_identity_admin_recovery.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/026_quarantine_promotion.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/027_audit_checkpoint_reader.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/028_quarantine_expiry_recovery.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/029_private_privilege_boundary.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/030_invoice_batch_budget.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/031_minimized_financial_reads.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/032_financial_access_budgets.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/033_startup_key_attestation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/034_public_runtime_grants.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/035_actor_threat_containment.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/036_privacy_recovery_inventory.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/037_automated_mapping_integrity.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/038_session_bound_promotion.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/039_live_security_catalog.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/040_emergency_tenant_containment.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/041_security_command_snapshot.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/042_security_catalog_internal_integrity.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/043_security_recovery_inventory.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/044_recovery_catalog_gate.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/045_payroll_proposal_review.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/046_payroll_attested_confirmation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/047_security_work_authority.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/048_sensitive_api_capabilities.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/public-runtime-grants.catalog.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/private-privilege.catalog.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/invoice-privacy.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/payroll-proposal-review.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/payroll-attested-confirmation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/security-work-authority.sql

      - name: Audit every tenant-scoped table and tenant-to-tenant foreign key
        env:
          PGPASSWORD: ci-admin-password
        run: psql "postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot" -v ON_ERROR_STOP=1 -f tests/tenant-isolation.catalog.sql

      - name: Verify tenant RLS with restricted runtime role
        env:
          PGPASSWORD: ci-admin-password
        run: |
          ADMIN_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot"
          APP_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO tenants(id,legal_name) VALUES ('11111111-1111-4111-8111-111111111111','CI tenant A'),('22222222-2222-4222-8222-222222222222','CI tenant B')"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -f tests/tenant-isolation.fixtures.sql
          psql "$APP_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM tenants) <> 0 THEN RAISE EXCEPTION 'RLS without tenant context did not deny rows'; END IF; END \$\$;"
          psql "$APP_URL" -v ON_ERROR_STOP=1 -c "BEGIN; SELECT set_config('app.tenant_id','11111111-1111-4111-8111-111111111111',true); DO \$\$ BEGIN IF (SELECT count(*) FROM tenants) <> 0 THEN RAISE EXCEPTION 'Raw tenant GUC must not grant access without a valid HMAC'; END IF; END \$\$; COMMIT;"

      - name: Run authenticated API integration tests
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" TEST_ADMIN_DATABASE_URL="$TEST_ADMIN_DATABASE_URL" node --test tests/api.integration.test.js
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" psql "postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" -v ON_ERROR_STOP=1 -f tests/tenant-isolation.runtime.sql

      - name: Verify signed audit checkpoints and alert policy
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/audit-checkpoint-monitor.test.js

      - name: Verify database-generated audit evidence and chain integrity
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/audit-integrity.integration.test.js

      - name: Verify restricted identity provisioning and account recovery
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/identity-admin.integration.test.js

      - name: Verify identity session revocation and fresh authentication
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/identity-session.integration.test.js

      - name: Verify exact row-level policy inventory and adversarial drift
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: node --test tests/rls-policy-drift.integration.test.js

      - name: Verify exact public runtime grants and adversarial drift
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: node --test tests/public-runtime-grants.integration.test.js

      - name: Verify security privilege gate rejects deliberately unsafe changes
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: node --test tests/privilege-drift-adversarial.integration.test.js

      - name: Verify distributed rate limiting and counter retention with real PostgreSQL
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/shared-rate-limit.test.js

      - name: Verify invoice batch resource budget under concurrent writes
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/invoice-capacity.integration.test.js

      - name: Stress shared security quotas and lock recovery
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/security-concurrency.integration.test.js

      - name: Verify guarded tenant key rotation and administrative audit
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/tenant-key-lifecycle.test.js

      - name: Verify legal holds, retention and controlled staging disposal
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/import-disposal.integration.test.js

      - name: Verify isolated scanner protocol, leases and hold-aware expiry
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/quarantine-scanner.test.js

      - name: Verify approved manifest-bound quarantine promotion
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/quarantine-promotion.integration.test.js

      - name: Verify encrypted private file quarantine and database authorization
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/quarantine.test.js

      - name: Verify minimized calculation exports and recent MFA
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/calculation-export.integration.test.js

      - name: Verify actor and tenant financial access budgets and audit chain
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/financial-access-budget.integration.test.js tests/actor-threat-containment.integration.test.js tests/live-catalog-drift.integration.test.js
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/emergency-containment.integration.test.js
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/security-command-centre.integration.test.js
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/emergency-race.integration.test.js
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/worker-credential-boundary.integration.test.js

      - name: Prepare quarantine expiry recovery fixture
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/quarantine-expiry-recovery.integration.test.js

      - name: Restore encrypted synthetic database backup and verify security after recovery
        env:
          PGPASSWORD: ci-admin-password
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          set -euo pipefail
          umask 077
          WORK="$(mktemp -d "$RUNNER_TEMP/profitpilot-restore-XXXXXX")"
          trap 'rm -rf "$WORK"' EXIT
          DUMP="$WORK/restored.dump"
          ARCHIVE="$WORK/backup.enc"
          export BACKUP_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$BACKUP_ENCRYPTION_KEY"
          PG_CONTAINER=profitpilot-postgres-ci
          test -n "$PG_CONTAINER"
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -v persist_recovery_fixture=1 -f tests/payroll-attested-confirmation.sql
          backup_start=$(date +%s)
          docker exec -e PGPASSWORD "$PG_CONTAINER" pg_dump -h 127.0.0.1 -U profitpilot_admin -Fc profitpilot | node scripts/secure-backup.js encrypt-stdin "$ARCHIVE"
          restore_start=$(date +%s)
          test -s "$ARCHIVE"
          node scripts/secure-backup.js decrypt "$ARCHIVE" "$DUMP"
          test -s "$DUMP"
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE profitpilot_restore_ci'
          docker exec -i -e PGPASSWORD "$PG_CONTAINER" pg_restore -h 127.0.0.1 -U profitpilot_admin --exit-on-error --single-transaction -d profitpilot_restore_ci < "$DUMP"
          RESTORE_ADMIN_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot_restore_ci"
          RESTORE_APP_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot_restore_ci"
          psql "$RESTORE_ADMIN_URL" -v ON_ERROR_STOP=1 -f tests/tenant-isolation.catalog.sql
          psql "$RESTORE_ADMIN_URL" -v ON_ERROR_STOP=1 -f tests/rls-policy-inventory.catalog.sql
          psql "$RESTORE_ADMIN_URL" -v ON_ERROR_STOP=1 -f tests/private-privilege.catalog.sql
          psql "$RESTORE_ADMIN_URL" -v ON_ERROR_STOP=1 -f tests/public-runtime-grants.catalog.sql
          if [ "$(psql "$RESTORE_ADMIN_URL" -v ON_ERROR_STOP=1 -Atc 'SELECT private.verify_security_catalog()')" != t ]; then
            # Synthetic schema-only diagnostics: no application rows, keys, or secrets.
            SQL="SELECT jsonb_build_array(item->>0,item->>1,item->>2,item->>3,encode(public.digest(convert_to(item::text,'UTF8'),'sha256'),'hex')) FROM private.security_catalog_entries() AS e(item) ORDER BY 1"
            psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "$SQL" > "$WORK/source-catalog"
            psql "$RESTORE_ADMIN_URL" -v ON_ERROR_STOP=1 -Atc "$SQL" > "$WORK/restored-catalog"
            diff -u "$WORK/source-catalog" "$WORK/restored-catalog" || true
            exit 1
          fi
          psql "$RESTORE_APP_URL" -v ON_ERROR_STOP=1 -f tests/tenant-isolation.runtime.sql
          TEST_RESTORE_BACKUP_SHA256="$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)" TEST_RESTORE_ADMIN_DATABASE_URL="$RESTORE_ADMIN_URL" TEST_RESTORE_APP_DATABASE_URL="$RESTORE_APP_URL" node --test tests/backup-restore.integration.test.js
          restore_end=$(date +%s)
          echo "Synthetic encrypted backup duration: $((restore_start-backup_start))s; isolated restore plus security reconciliation: $((restore_end-restore_start))s (not production RTO/RPO)"
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP DATABASE profitpilot_restore_ci'

      - name: Build production API image
        run: docker build --pull -t profitpilot-api:ci .

      - name: Enable verified TLS on ephemeral PostgreSQL
        env:
          PGPASSWORD: ci-admin-password
        run: |
          set -eu
          CERT="$RUNNER_TEMP/profitpilot-postgres.crt"
          KEY="$RUNNER_TEMP/profitpilot-postgres.key"
          openssl req -new -x509 -newkey rsa:2048 -nodes -days 1 -keyout "$KEY" -out "$CERT" -subj "/CN=localhost" -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" -addext "basicConstraints=critical,CA:TRUE"
          PG_CONTAINER=profitpilot-postgres-ci
          test -n "$PG_CONTAINER"
          docker cp "$CERT" "$PG_CONTAINER:/var/lib/postgresql/data/server.crt"
          docker cp "$KEY" "$PG_CONTAINER:/var/lib/postgresql/data/server.key"
          docker exec -u root "$PG_CONTAINER" chown postgres:postgres /var/lib/postgresql/data/server.crt /var/lib/postgresql/data/server.key
          docker exec -u root "$PG_CONTAINER" chmod 600 /var/lib/postgresql/data/server.key
          ADMIN_URL="postgresql://profitpilot_admin:ci-admin-password@127.0.0.1:5432/profitpilot"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl='on'"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_cert_file='server.crt'"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_key_file='server.key'"
          docker restart "$PG_CONTAINER"
          for attempt in $(seq 1 30); do
            if psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "SHOW ssl" | grep -q on; then break; fi
            sleep 2
          done
          psql "$ADMIN_URL?sslmode=require" -v ON_ERROR_STOP=1 -c "SHOW ssl" | grep -q on
          docker exec "$PG_CONTAINER" sh -ec 'test "$(awk "/^Uid:/ {print \$2}" /proc/1/status)" = "$(id -u postgres)"'
          {
            echo 'DATABASE_SSL_CA<<PROFITPILOT_CA'
            cat "$CERT"
            echo 'PROFITPILOT_CA'
          } >> "$GITHUB_ENV"

      - name: Verify PostgreSQL TLS certificate validation
        env:
          DATABASE_SSL_TEST_URL: postgresql://profitpilot_app:${{ env.POSTGRES_APP_PASSWORD }}@127.0.0.1:5432/profitpilot
        run: node --test tests/db-tls.integration.test.js tests/production-readiness.integration.test.js

      - name: Verify actual read-only dashboard through TLS database and HTTPS boundary
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@127.0.0.1:5432/profitpilot
          TEST_DASHBOARD_TLS_KEY: ${{ runner.temp }}/profitpilot-postgres.key
          TEST_DASHBOARD_TLS_CERT: ${{ runner.temp }}/profitpilot-postgres.crt
        run: node --test tests/security-dashboard.integration.test.js

      - name: Start production-mode container and verify database TLS health endpoint
        env:
          CORS_ORIGIN: https://ci.invalid
          AUTH_ISSUER: https://profitpilot-ci.invalid/
          AUTH_AUDIENCE: profitpilot-api
          AUTH_JWKS_URL: https://profitpilot-ci.invalid/.well-known/jwks.json
        run: |
          set -eu
          DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@127.0.0.1:5432/profitpilot"
          docker run -d --network host --name profitpilot-api-ci --init --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=100 --tmpfs /tmp:rw,noexec,nosuid,size=64m -e NODE_ENV=production -e PORT=8080 -e DATABASE_URL="$DATABASE_URL" -e DATABASE_SSL=true -e DATABASE_SSL_CA -e CORS_ORIGIN="$CORS_ORIGIN" -e AUTH_ISSUER="$AUTH_ISSUER" -e AUTH_AUDIENCE="$AUTH_AUDIENCE" -e AUTH_JWKS_URL="$AUTH_JWKS_URL" -e AUTH_ACCESS_TOKEN_PROFILE=rfc9068 -e AUTH_MFA_ACR=urn:ci:mfa -e TENANT_CONTEXT_HMAC_SECRET="$TENANT_CONTEXT_HMAC_SECRET" -e RATE_LIMIT_HASH_SECRET profitpilot-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health | grep -q '"database":"connected"'; then
              echo 'Production-mode verified database TLS health check passed'
              trap 'docker rm -f profitpilot-api-ci >/dev/null 2>&1 || true' EXIT
              node scripts/check-production-network.js
              exit 0
            fi
            sleep 2
          done
          docker logs profitpilot-api-ci
          docker rm -f profitpilot-api-ci
          exit 1


  operational:
    name: Synthetic operational acceptance and real ClamAV engine controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify]
    permissions:
      contents: read
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install authenticated distribution ClamAV packages
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clamav-daemon
          sudo systemctl stop clamav-freshclam.service clamav-daemon.service clamav-daemon.socket || true
          clamd --version
      - name: Test isolated genuine ClamAV clean and detection controls and strict freshness denial
        run: bash scripts/check-real-clamav-ci.sh
      - name: Verify signed webhook delivery and dashboard request controls
        run: node --test tests/security-alert-delivery.test.js tests/security-alert-tls.test.js tests/security-dashboard.test.js tests/security-recovery.test.js

  supply-chain:
    name: Container and software supply-chain audit
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build pinned synthetic API image and isolated dependency stage
        run: |
          docker build --pull --target dependencies -t profitpilot-dependencies:scan .
          docker build --pull -t profitpilot-api:scan .

      - name: Verify runtime user, package inventory and removal of build tools
        run: |
          set -eu
          test "$(docker run --rm --network none --entrypoint id profitpilot-api:scan -u)" != 0
          docker run --rm --network none --read-only --entrypoint npm profitpilot-dependencies:scan ls --omit=dev --all --json >/tmp/profitpilot-dependencies.json
          docker run --rm --network none --read-only --entrypoint npm profitpilot-dependencies:scan sbom --sbom-format cyclonedx --omit=dev --package-lock-only >/tmp/profitpilot-sbom.json
          docker run --rm --network none --read-only --entrypoint sh profitpilot-api:scan -ec 'for tool in npm npx corepack yarn pnpm; do ! command -v "$tool" || exit 1; done; test ! -d /usr/local/lib/node_modules; node --version'
          docker run --rm --network none --read-only --entrypoint node profitpilot-api:scan --input-type=module -e '
            import {readFileSync} from "node:fs";
            const lock=JSON.parse(readFileSync("package-lock.json","utf8"));
            for(const [path,p] of Object.entries(lock.packages)){
              if(!path||p.dev)continue;
              let installed;
              try{installed=JSON.parse(readFileSync(path+"/package.json","utf8"));}
              catch(e){if(p.optional&&e.code==="ENOENT")continue;throw e;}
              if(installed.version!==p.version)throw Error("Runtime package version differs from lockfile");
            }
          '

      - name: Install versioned scanner with publisher checksum verification
        run: |
          set -eu
          umask 077
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          cd "$WORK"
          BASE=https://github.com/aquasecurity/trivy/releases/download/v0.69.3
          ARCHIVE=trivy_0.69.3_Linux-64bit.tar.gz
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 120 "$BASE/$ARCHIVE" -o "$ARCHIVE"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 120 "$BASE/trivy_0.69.3_checksums.txt" -o checksums.txt
          awk -v name="$ARCHIVE" '$2==name || $2=="*"name {print}' checksums.txt > selected.txt
          test "$(wc -l < selected.txt)" -eq 1
          sha256sum --check --strict selected.txt
          tar -xzf "$ARCHIVE" trivy
          install -m 0755 trivy "$RUNNER_TEMP/profitpilot-trivy"
          "$RUNNER_TEMP/profitpilot-trivy" --version

      - name: Scan API image and pinned database image for high and critical vulnerabilities
        run: |
          set -eu
          SCANNER="$RUNNER_TEMP/profitpilot-trivy"
          docker build --pull -f database/Dockerfile.postgres -t profitpilot-postgres:scan database
          test "$(docker image inspect profitpilot-postgres:scan --format '{{len .RootFS.Layers}}')" = 1
          docker run --rm --network none --entrypoint sh profitpilot-postgres:scan -ec 'test ! -e /usr/local/bin/gosu; test ! -L /usr/local/bin/gosu; test -x /sbin/su-exec; postgres --version'
          result=0
          "$SCANNER" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed=false --exit-code 1 --no-progress --timeout 5m --ignorefile /dev/null --format json --output "$RUNNER_TEMP/api-scan.json" profitpilot-api:scan || result=1
          "$SCANNER" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed=false --exit-code 1 --no-progress --timeout 5m --ignorefile /dev/null --format json --output "$RUNNER_TEMP/database-scan.json" profitpilot-postgres:scan || result=1
          exit "$result"

      - name: Package exact scanned image archives and public build evidence
        if: ${{ github.repository == 'luxhustle01-ux/Profitpilot' && ((github.event_name == 'push' && github.ref == 'refs/heads/security/tenant-isolation-release-gate-20261118') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/tenant-isolation-release-gate-20261118')) }}
        run: |
          set -euo pipefail
          umask 077
          DIR="$RUNNER_TEMP/profitpilot-candidate"
          mkdir "$DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(docker image inspect profitpilot-api:scan --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect profitpilot-postgres:scan --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          git archive --format=tar "$GITHUB_SHA" | gzip -n > "$DIR/source.tar.gz"
          docker save profitpilot-api:scan | gzip -n > "$DIR/api-image.tar.gz"
          docker save profitpilot-postgres:scan | gzip -n > "$DIR/database-image.tar.gz"
          cp /tmp/profitpilot-sbom.json "$DIR/sbom.json"
          cp "$RUNNER_TEMP/api-scan.json" "$DIR/api-scan.json"
          cp "$RUNNER_TEMP/database-scan.json" "$DIR/database-scan.json"
          node scripts/release-candidate-manifest.js build "$DIR" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$(docker image inspect profitpilot-api:scan --format '{{.Id}}')" \
            "$(docker image inspect profitpilot-postgres:scan --format '{{.Id}}')"

      - name: Retain immutable candidate artifact for verification
        if: ${{ github.repository == 'luxhustle01-ux/Profitpilot' && ((github.event_name == 'push' && github.ref == 'refs/heads/security/tenant-isolation-release-gate-20261118') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/tenant-isolation-release-gate-20261118')) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profitpilot-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/profitpilot-candidate/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  security-gate:
    name: Security CI release gate
    runs-on: ubuntu-latest
    needs: [verify, database, supply-chain, operational, provenance]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: Require successful application and database security checks
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
          OPERATIONAL_RESULT: ${{ needs.operational.result }}
          PROVENANCE_RESULT: ${{ needs.provenance.result }}
          PROVENANCE_REQUIRED: ${{ github.repository == 'luxhustle01-ux/Profitpilot' && ((github.event_name == 'push' && github.ref == 'refs/heads/security/tenant-isolation-release-gate-20261118') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/tenant-isolation-release-gate-20261118')) }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          echo "Security verification commit: $TESTED_SHA"
          echo "Node/application verification: $VERIFY_RESULT"
          echo "PostgreSQL/API/RLS/TLS verification: $DATABASE_RESULT"
          test "$VERIFY_RESULT" = success
          test "$DATABASE_RESULT" = success
          test "$SUPPLY_CHAIN_RESULT" = success
          test "$OPERATIONAL_RESULT" = success
          if [ "$PROVENANCE_REQUIRED" = true ]; then test "$PROVENANCE_RESULT" = success; else test "$PROVENANCE_RESULT" = skipped; fi
          {
            echo "## ProfitPilot security CI gate"
            echo "- Commit: \`$TESTED_SHA\`"
            echo "- Node.js application checks: $VERIFY_RESULT"
            echo "- PostgreSQL, tenant RLS, identity/session revocation, audit chains/checkpoints, authenticated API, distributed limits, key lifecycle, invoice privacy boundary, retention/holds/disposal, MFA-gated export, encrypted file quarantine, scanner protocol, strict CSV preflight, approved manifest promotion and expiry, encrypted synthetic recovery and revocation/tombstone replay, TLS and container checks: $DATABASE_RESULT"
            echo "- Container and software supply-chain audit: $SUPPLY_CHAIN_RESULT"
            echo "- Synthetic operational acceptance and real scanner engine controls: $OPERATIONAL_RESULT"
            echo "- Signed candidate provenance: $PROVENANCE_RESULT (required: $PROVENANCE_REQUIRED)"
            echo "- Scope: automated repository CI only; not penetration testing or production certification"
          } >> "$GITHUB_STEP_SUMMARY"


  provenance:
    name: Signed candidate provenance and independent byte verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify, database, supply-chain, operational]
    if: ${{ github.repository == 'luxhustle01-ux/Profitpilot' && ((github.event_name == 'push' && github.ref == 'refs/heads/security/tenant-isolation-release-gate-20261118') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/tenant-isolation-release-gate-20261118')) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download artifact from the same run and attempt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: profitpilot-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/profitpilot-verified

      - name: Verify candidate identity, artifact inventory and all digests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/release-candidate-manifest.js verify "$RUNNER_TEMP/profitpilot-verified" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          # Independently reconstruct the source archive and verify the two
          # image identities from the exact exported, scanned image bytes.
          git archive --format=tar "$GITHUB_SHA" | gzip -n | cmp - "$RUNNER_TEMP/profitpilot-verified/source.tar.gz"
          docker load --input "$RUNNER_TEMP/profitpilot-verified/api-image.tar.gz"
          docker load --input "$RUNNER_TEMP/profitpilot-verified/database-image.tar.gz"
          test "$(docker image inspect profitpilot-api:scan --format '{{.Id}}')" = "$(jq -r .apiImage "$RUNNER_TEMP/profitpilot-verified/manifest.json")"
          test "$(docker image inspect profitpilot-postgres:scan --format '{{.Id}}')" = "$(jq -r .databaseImage "$RUNNER_TEMP/profitpilot-verified/manifest.json")"

      - name: Attest verified candidate manifest with GitHub OIDC provenance
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/profitpilot-verified/manifest.json
          push-to-registry: false

      - name: Verify cryptographic provenance against repository, workflow, source ref and commit
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE"
          gh attestation verify "$RUNNER_TEMP/profitpilot-verified/manifest.json" \
            --bundle "$BUNDLE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
          cp "$BUNDLE" "$RUNNER_TEMP/provenance-bundle.jsonl"

      - name: Retain signed provenance for candidate handover
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profitpilot-provenance-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provenance-bundle.jsonl
          if-no-files-found: error
          retention-days: 7
