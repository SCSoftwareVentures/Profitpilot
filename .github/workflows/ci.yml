name: ProfitPilot CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profitpilot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependency vulnerability audit (high and critical gate)
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax checks
        run: npm run check

      - name: Unit tests
        run: npm test

  database:
    name: PostgreSQL migrations and tenant RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: profitpilot
          POSTGRES_USER: profitpilot_admin
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profitpilot_admin -d profitpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Generate ephemeral tenant context signing key
        run: |
          SIGNING_KEY="$(openssl rand -hex 32)"
          APP_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$SIGNING_KEY"
          echo "::add-mask::$APP_PASSWORD"
          echo "TENANT_CONTEXT_HMAC_SECRET=$SIGNING_KEY" >> "$GITHUB_ENV"
          echo "POSTGRES_APP_PASSWORD=$APP_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply schema, runtime role and migrations
        env:
          PGPASSWORD: ci-admin-password
        run: |
          DB_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
          POSTGRES_APP_PASSWORD="$POSTGRES_APP_PASSWORD" psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/init/002-runtime-role.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/002_tenant_rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/init/003-tenant-context-key.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/003_allocation_lines.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/004_import_validation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/005_prevent_duplicate_confirmations.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/006_tenant_actor_membership_fks.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/007_users_self_rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/008_runtime_least_privilege.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/009_payroll_source_lineage.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/010_payroll_allocation_integrity.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/011_source_file_receipts.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/012_invoice_identity_claims.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/013_runtime_actor_policies.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/014_privacy_requests.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/015_scan_receipts.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/016_narrow_privacy_disposal.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/017_invoice_confirmation_rehearsal.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/018_payroll_contract_rehearsal.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/019_privacy_audit_and_index.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/020_audit_privacy_least_privilege.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/021_privacy_case_dual_review.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/022_privacy_case_evidence_gate.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/023_calculation_restatement.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/024_unified_report_snapshots.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/025_securepay_evidence_register.sql

      - name: Verify tenant RLS with restricted runtime role
        env:
          PGPASSWORD: ci-admin-password
        run: |
          ADMIN_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot"
          APP_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO tenants(id,legal_name) VALUES ('11111111-1111-4111-8111-111111111111','CI tenant A'),('22222222-2222-4222-8222-222222222222','CI tenant B')"
          psql "$APP_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM tenants) <> 0 THEN RAISE EXCEPTION 'RLS without tenant context did not deny rows'; END IF; END \$\$;"
          psql "$APP_URL" -v ON_ERROR_STOP=1 -c "BEGIN; SELECT set_config('app.tenant_id','11111111-1111-4111-8111-111111111111',true); DO \$\$ BEGIN IF (SELECT count(*) FROM tenants) <> 0 THEN RAISE EXCEPTION 'Raw tenant GUC must not grant access without a valid HMAC'; END IF; END \$\$; COMMIT;"

      - name: Run authenticated API integration tests
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" TEST_ADMIN_DATABASE_URL="$TEST_ADMIN_DATABASE_URL" node --test tests/api.integration.test.js
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" TEST_ADMIN_DATABASE_URL="$TEST_ADMIN_DATABASE_URL" node --test tests/securepay-storage.integration.test.js

      - name: Rehearse encrypted synthetic database backup and restore
        env:
          PGPASSWORD: ci-admin-password
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          umask 077
          ADMIN_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot"
          RESTORE_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot_restore"
          BACKUP_DIR="$(mktemp -d)"
          trap 'rm -rf "$BACKUP_DIR"' EXIT
          export GNUPGHOME="$BACKUP_DIR/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          openssl rand -hex 32 > "$BACKUP_DIR/passphrase"
          docker exec -e PGPASSWORD="$PGPASSWORD" "$PG_CONTAINER" pg_dump -h 127.0.0.1 -U profitpilot_admin -d profitpilot --format=custom | gpg --batch --yes --pinentry-mode loopback --no-symkey-cache --passphrase-file "$BACKUP_DIR/passphrase" --symmetric --cipher-algo AES256 --output "$BACKUP_DIR/backup.gpg"
          test -s "$BACKUP_DIR/backup.gpg"
          openssl rand -hex 32 > "$BACKUP_DIR/wrong-passphrase"
          if gpg --batch --yes --pinentry-mode loopback --no-symkey-cache --passphrase-file "$BACKUP_DIR/wrong-passphrase" --decrypt "$BACKUP_DIR/backup.gpg" >/dev/null 2>&1; then
            echo "Encrypted backup accepted an incorrect key"; exit 1
          fi
          DUMP="$BACKUP_DIR/verified.dump"
          gpg --batch --yes --pinentry-mode loopback --no-symkey-cache --passphrase-file "$BACKUP_DIR/passphrase" --decrypt --output "$DUMP" "$BACKUP_DIR/backup.gpg"
          createdb -h localhost -U profitpilot_admin profitpilot_restore
          docker exec -i -e PGPASSWORD="$PGPASSWORD" "$PG_CONTAINER" pg_restore -h 127.0.0.1 -U profitpilot_admin -d profitpilot_restore --exit-on-error --single-transaction < "$DUMP"
          QUERY="SELECT (SELECT count(*) FROM tenants),(SELECT count(*) FROM raw_import_rows),(SELECT count(*) FROM audit_events),(SELECT count(*) FROM invoice_identity_claims),(SELECT count(*) FROM invoice_confirmation_rehearsals),(SELECT count(*) FROM payroll_contract_rehearsals),(SELECT count(*) FROM calculation_runs),(SELECT count(*) FROM calculation_restatements),(SELECT count(*) FROM unified_report_snapshots),(SELECT count(*) FROM securepay_case_rehearsals),(SELECT count(*) FROM securepay_evidence_rehearsals),(SELECT count(*) FROM privacy_requests),(SELECT count(*) FROM import_source_receipts WHERE sha256=encode(public.digest(original_bytes,'sha256'),'hex'));"
          test "$(psql "$ADMIN_URL" -At -c "$QUERY")" = "$(psql "$RESTORE_URL" -At -c "$QUERY")"
          RESTORED_APP="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot_restore"
          test "$(psql "$RESTORED_APP" -At -c 'SELECT count(*) FROM tenants;')" = "0"
          psql "$RESTORE_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF EXISTS (SELECT 1 FROM import_source_receipts WHERE sha256<>encode(public.digest(original_bytes,'sha256'),'hex')) THEN RAISE EXCEPTION 'Restored source receipt checksum mismatch'; END IF; END \$\$;"
          echo 'Encrypted synthetic database restored; wrong-key rejection, counts, receipt hashes and deny-by-default RLS checked'
          dropdb -h localhost -U profitpilot_admin profitpilot_restore

      - name: Build production API image
        run: docker build --pull -t profitpilot-api:ci .

      - name: Start container and verify database health endpoint
        env:
          CORS_ORIGIN: https://ci.invalid
          AUTH_ISSUER: https://profitpilot-ci.invalid/
          AUTH_AUDIENCE: profitpilot-api
          AUTH_JWKS_URL: https://profitpilot-ci.invalid/.well-known/jwks.json
        run: |
          set -eu
          DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@127.0.0.1:5432/profitpilot"
          docker run -d --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --network host --name profitpilot-api-ci -e NODE_ENV=production -e PROFITPILOT_PROFILE=prototype -e PORT=8080 -e DATABASE_URL="$DATABASE_URL" -e DATABASE_SSL=false -e CORS_ORIGIN="$CORS_ORIGIN" -e AUTH_ISSUER="$AUTH_ISSUER" -e AUTH_AUDIENCE="$AUTH_AUDIENCE" -e AUTH_JWKS_URL="$AUTH_JWKS_URL" -e TENANT_CONTEXT_HMAC_SECRET="$TENANT_CONTEXT_HMAC_SECRET" profitpilot-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health | grep -q '"database":"connected"'; then
              echo 'Production container health check passed'
              docker rm -f profitpilot-api-ci
              exit 0
            fi
            sleep 2
          done
          docker logs profitpilot-api-ci
          docker rm -f profitpilot-api-ci
          exit 1


      - name: Build protected scanner image
        run: docker build --target protected --pull -t profitpilot-protected:ci .

      - name: Build isolated CI-only scanner fixture image
        run: docker build --target scanner-fixture -t profitpilot-scanner-fixture:ci .

      - name: Verify native scanner with isolated harmless test signature
        run: |
          set -euo pipefail
          SIGDIR="$(mktemp -d)"
          trap 'rm -rf "$SIGDIR"' EXIT
          chmod 755 "$SIGDIR"
          printf '%s' 'ProfitPilot harmless scanner test marker 2026' > "$SIGDIR/marker"
          HASH="$(md5sum "$SIGDIR/marker" | cut -d ' ' -f1)"
          SIZE="$(wc -c < "$SIGDIR/marker" | tr -d ' ')"
          printf '%s:%s:%s\n' "$HASH" "$SIZE" 'ProfitPilot.CI.Harmless.Marker' > "$SIGDIR/local.hdb"
          rm "$SIGDIR/marker"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges -v "$SIGDIR:/var/lib/clamav:ro" --entrypoint node profitpilot-scanner-fixture:ci --input-type=module -e 'import {scanSource} from "./server/malware.js"; import assert from "node:assert/strict"; assert.equal(await scanSource(Buffer.from("Ordinary harmless fixture"),{enabled:true}),"scanner_reported_clean"); assert.equal(await scanSource(Buffer.from("ProfitPilot harmless scanner test marker 2026"),{enabled:true}),"infected"); const {spawnSync}=await import("node:child_process"); for(const input of [Buffer.alloc(0),Buffer.alloc(524289,65)]){const r=spawnSync("/usr/local/bin/profitpilot-scan",[],{input,timeout:30000}); assert.equal(r.status,2);} console.log("Native scanner accepted clean fixture and rejected custom harmless signature");'
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges -v "$SIGDIR:/var/lib/clamav:ro" --entrypoint node profitpilot-protected:ci --input-type=module -e 'import assert from "node:assert/strict"; import {scanSource} from "./server/malware.js"; assert.equal(await scanSource(Buffer.from("Ordinary harmless fixture"),{enabled:true}),"unavailable"); console.log("Protected scanner rejects custom-only signatures");'
          printf 'Not a signed CVD' > "$SIGDIR/main.cvd"
          cp "$SIGDIR/main.cvd" "$SIGDIR/daily.cvd"
          cp "$SIGDIR/main.cvd" "$SIGDIR/bytecode.cvd"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges -v "$SIGDIR:/var/lib/clamav:ro" --entrypoint node profitpilot-protected:ci --input-type=module -e 'import assert from "node:assert/strict"; import {scanSource} from "./server/malware.js"; assert.equal(await scanSource(Buffer.from("Ordinary harmless fixture"),{enabled:true}),"unavailable"); console.log("Protected scanner rejects counterfeit CVD files");'

  container_security:
    name: Container vulnerability analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install checksum-verified Grype
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          curl --fail --silent --show-error --location --retry 3 'https://github.com/anchore/grype/releases/download/v0.104.1/grype_0.104.1_linux_amd64.tar.gz' -o "$WORK/grype.tar.gz"
          printf '%s  %s\n' '2cb820b6c81f88fd6aff3fb4ca5a7161e9ab70af0f27fc5e99cd16deb987cd5f' "$WORK/grype.tar.gz" | sha256sum --check
          tar -xzf "$WORK/grype.tar.gz" -C "$WORK" grype
          install -m 0755 "$WORK/grype" "$RUNNER_TEMP/grype"
          "$RUNNER_TEMP/grype" version
      - name: Build both container profiles
        run: |
          docker build --pull -t profitpilot-api:security .
          docker build --target protected -t profitpilot-protected:security .
      - name: Verify both images omit build tooling and run non-root
        run: |
          set -euo pipefail
          for image in profitpilot-api:security profitpilot-protected:security; do
            docker run --rm --network none --entrypoint node "$image" --input-type=module -e 'import assert from "node:assert/strict"; import {existsSync,readFileSync} from "node:fs"; import tls from "node:tls"; assert.notEqual(process.getuid(),0); for(const path of ["/usr/local/bin/npm","/usr/local/bin/npx","/usr/local/bin/yarn","/usr/local/bin/corepack","/usr/local/lib/node_modules"])assert.equal(existsSync(path),false,path); const inventory=readFileSync("/lib/apk/db/installed","utf8"); assert.match(inventory,/^P:musl$/m); {for(const path of ["/bin/busybox","/bin/sh","/usr/bin/wget","/usr/bin/ssl_client","/sbin/apk"])assert.equal(existsSync(path),false,path); for(const pkg of ["busybox","busybox-binsh","ssl_client"])assert.ok(!inventory.split("\n").includes("P:"+pkg),pkg);} assert.equal(existsSync("/usr/local/bin/profitpilot-scan"),process.argv[1]==="profitpilot-protected:security"); if(process.argv[1]==="profitpilot-protected:security"){assert.match(inventory,/^P:clamav-libs$/m);assert.match(inventory,/^P:clamav-libunrar$/m);assert.ok(!inventory.split("\n").includes("P:freshclam"));} assert.ok(tls.rootCertificates.length>0); assert.ok(existsSync("/etc/ssl/cert.pem")); await import("express"); await import("pg"); await import("jose"); console.log("Runtime identity, inventory, trust store and modules verified for",process.argv[1]);' "$image"
          done
      - name: Verify protected scanner fails closed without definitions
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --entrypoint node profitpilot-protected:security --input-type=module -e 'import assert from "node:assert/strict"; import {scanSource} from "./server/malware.js"; assert.equal(await scanSource(Buffer.from("synthetic fixture"),{enabled:true}),"unavailable");'
      - name: Scan both images with current vulnerability database
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/grype" db update
          "$RUNNER_TEMP/grype" docker:profitpilot-api:security -o json > prototype-vulnerabilities.json
          "$RUNNER_TEMP/grype" docker:profitpilot-protected:security -o json > protected-vulnerabilities.json
      - name: Retain container vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-vulnerability-reports
          path: |
            prototype-vulnerabilities.json
            protected-vulnerabilities.json
          if-no-files-found: warn
      - name: Enforce container vulnerability severity policy
        run: node scripts/check-container-vulnerabilities.mjs prototype-vulnerabilities.json protected-vulnerabilities.json

  static_analysis:
    name: CodeQL JavaScript static security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
          build-mode: none
      - name: Analyze source
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:javascript-typescript
          output: codeql-results
      - name: Enforce zero CodeQL findings and successful extraction
        run: node scripts/check-static-analysis.mjs codeql-results/javascript.sarif
      - name: Retain analysis results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: javascript-static-analysis
          path: codeql-results
          if-no-files-found: warn

  provenance:
    name: Source package, SBOM and signed provenance
    needs: [verify, database, static_analysis, container_security]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build source evidence and dependency inventory
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir release-evidence
          git archive --format=tar.gz --prefix=profitpilot/ "$GITHUB_SHA" > release-evidence/profitpilot-source.tar.gz
          npm sbom --sbom-format=cyclonedx --omit=dev > release-evidence/dependencies.cdx.json
          node -e 'const s=JSON.parse(require("fs").readFileSync("release-evidence/dependencies.cdx.json")); if(s.bomFormat!=="CycloneDX"||!s.components?.length)process.exit(1)'
          printf '%s\n' "$GITHUB_SHA" > release-evidence/COMMIT.txt
          (cd release-evidence && sha256sum profitpilot-source.tar.gz dependencies.cdx.json COMMIT.txt > SHA256SUMS && sha256sum -c SHA256SUMS)
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf profitpilot-source-evidence.tar.gz -C release-evidence .
      - name: Sign source evidence provenance
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: profitpilot-source-evidence.tar.gz
      - name: Verify signed provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          gh attestation verify profitpilot-source-evidence.tar.gz --repo "$GITHUB_REPOSITORY" --bundle "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" profitpilot-attestation.jsonl
      - name: Retain buyer-verifiable source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profitpilot-source-evidence-${{ github.sha }}
          path: |
            profitpilot-source-evidence.tar.gz
            profitpilot-attestation.jsonl
          if-no-files-found: error
          retention-days: 30
