name: ProfitPilot CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profitpilot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dependency vulnerability audit (high and critical gate)
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax checks
        run: npm run check

      - name: Unit tests
        run: npm test

  database:
    name: PostgreSQL migrations and tenant RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: profitpilot
          POSTGRES_USER: profitpilot_admin
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profitpilot_admin -d profitpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Generate ephemeral tenant context signing key
        run: |
          echo "TENANT_CONTEXT_HMAC_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Apply schema, runtime role and migrations
        env:
          PGPASSWORD: ci-admin-password
        run: |
          DB_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
          POSTGRES_APP_PASSWORD="$POSTGRES_APP_PASSWORD" psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/init/002-runtime-role.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/002_tenant_rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/init/003-tenant-context-key.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/003_allocation_lines.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/004_import_validation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/005_prevent_duplicate_confirmations.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/006_tenant_actor_membership_fks.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/007_users_self_rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/008_runtime_least_privilege.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/009_payroll_source_lineage.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/010_payroll_allocation_integrity.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/011_source_file_receipts.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/012_invoice_identity_claims.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/013_runtime_actor_policies.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/014_privacy_requests.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/015_scan_receipts.sql

      - name: Verify tenant RLS with restricted runtime role
        env:
          PGPASSWORD: ci-admin-password
        run: |
          ADMIN_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot"
          APP_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO tenants(id,legal_name) VALUES ('11111111-1111-4111-8111-111111111111','CI tenant A'),('22222222-2222-4222-8222-222222222222','CI tenant B')"
          psql "$APP_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM tenants) <> 0 THEN RAISE EXCEPTION 'RLS without tenant context did not deny rows'; END IF; END \$\$;"
          psql "$APP_URL" -v ON_ERROR_STOP=1 -c "BEGIN; SELECT set_config('app.tenant_id','11111111-1111-4111-8111-111111111111',true); DO \$\$ BEGIN IF (SELECT count(*) FROM tenants) <> 0 THEN RAISE EXCEPTION 'Raw tenant GUC must not grant access without a valid HMAC'; END IF; END \$\$; COMMIT;"

      - name: Run authenticated API integration tests
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" TEST_ADMIN_DATABASE_URL="$TEST_ADMIN_DATABASE_URL" node --test tests/api.integration.test.js

      - name: Rehearse encrypted synthetic database backup and restore
        env:
          PGPASSWORD: ci-admin-password
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          umask 077
          ADMIN_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot"
          RESTORE_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot_restore"
          BACKUP_DIR="$(mktemp -d)"
          trap 'rm -rf "$BACKUP_DIR"' EXIT
          export GNUPGHOME="$BACKUP_DIR/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          openssl rand -hex 32 > "$BACKUP_DIR/passphrase"
          docker exec -e PGPASSWORD="$PGPASSWORD" "$PG_CONTAINER" pg_dump -h 127.0.0.1 -U profitpilot_admin -d profitpilot --format=custom | gpg --batch --yes --pinentry-mode loopback --no-symkey-cache --passphrase-file "$BACKUP_DIR/passphrase" --symmetric --cipher-algo AES256 --output "$BACKUP_DIR/backup.gpg"
          test -s "$BACKUP_DIR/backup.gpg"
          openssl rand -hex 32 > "$BACKUP_DIR/wrong-passphrase"
          if gpg --batch --yes --pinentry-mode loopback --no-symkey-cache --passphrase-file "$BACKUP_DIR/wrong-passphrase" --decrypt "$BACKUP_DIR/backup.gpg" >/dev/null 2>&1; then
            echo "Encrypted backup accepted an incorrect key"; exit 1
          fi
          DUMP="$BACKUP_DIR/verified.dump"
          gpg --batch --yes --pinentry-mode loopback --no-symkey-cache --passphrase-file "$BACKUP_DIR/passphrase" --decrypt --output "$DUMP" "$BACKUP_DIR/backup.gpg"
          createdb -h localhost -U profitpilot_admin profitpilot_restore
          docker exec -i -e PGPASSWORD="$PGPASSWORD" "$PG_CONTAINER" pg_restore -h 127.0.0.1 -U profitpilot_admin -d profitpilot_restore --exit-on-error --single-transaction < "$DUMP"
          QUERY="SELECT (SELECT count(*) FROM tenants),(SELECT count(*) FROM raw_import_rows),(SELECT count(*) FROM audit_events),(SELECT count(*) FROM invoice_identity_claims),(SELECT count(*) FROM calculation_runs),(SELECT count(*) FROM privacy_requests),(SELECT count(*) FROM import_source_receipts WHERE sha256=encode(public.digest(original_bytes,'sha256'),'hex'));"
          test "$(psql "$ADMIN_URL" -At -c "$QUERY")" = "$(psql "$RESTORE_URL" -At -c "$QUERY")"
          RESTORED_APP="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot_restore"
          test "$(psql "$RESTORED_APP" -At -c 'SELECT count(*) FROM tenants;')" = "0"
          psql "$RESTORE_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF EXISTS (SELECT 1 FROM import_source_receipts WHERE sha256<>encode(public.digest(original_bytes,'sha256'),'hex')) THEN RAISE EXCEPTION 'Restored source receipt checksum mismatch'; END IF; END \$\$;"
          echo 'Encrypted synthetic database restored; wrong-key rejection, counts, receipt hashes and deny-by-default RLS checked'
          dropdb -h localhost -U profitpilot_admin profitpilot_restore

      - name: Build production API image
        run: docker build --pull -t profitpilot-api:ci .

      - name: Start container and verify database health endpoint
        env:
          CORS_ORIGIN: https://ci.invalid
          AUTH_ISSUER: https://profitpilot-ci.invalid/
          AUTH_AUDIENCE: profitpilot-api
          AUTH_JWKS_URL: https://profitpilot-ci.invalid/.well-known/jwks.json
        run: |
          set -eu
          DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@127.0.0.1:5432/profitpilot"
          docker run -d --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges --network host --name profitpilot-api-ci -e NODE_ENV=production -e PROFITPILOT_PROFILE=prototype -e PORT=8080 -e DATABASE_URL="$DATABASE_URL" -e DATABASE_SSL=false -e CORS_ORIGIN="$CORS_ORIGIN" -e AUTH_ISSUER="$AUTH_ISSUER" -e AUTH_AUDIENCE="$AUTH_AUDIENCE" -e AUTH_JWKS_URL="$AUTH_JWKS_URL" -e TENANT_CONTEXT_HMAC_SECRET="$TENANT_CONTEXT_HMAC_SECRET" profitpilot-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health | grep -q '"database":"connected"'; then
              echo 'Production container health check passed'
              docker rm -f profitpilot-api-ci
              exit 0
            fi
            sleep 2
          done
          docker logs profitpilot-api-ci
          docker rm -f profitpilot-api-ci
          exit 1


      - name: Build protected scanner image
        run: docker build --target protected --pull -t profitpilot-protected:ci .

      - name: Verify native scanner with isolated harmless test signature
        run: |
          set -euo pipefail
          SIGDIR="$(mktemp -d)"
          trap 'rm -rf "$SIGDIR"' EXIT
          chmod 755 "$SIGDIR"
          printf '%s' 'ProfitPilot harmless scanner test marker 2026' > "$SIGDIR/marker"
          HASH="$(md5sum "$SIGDIR/marker" | cut -d ' ' -f1)"
          SIZE="$(wc -c < "$SIGDIR/marker" | tr -d ' ')"
          printf '%s:%s:%s\n' "$HASH" "$SIZE" 'ProfitPilot.CI.Harmless.Marker' > "$SIGDIR/local.hdb"
          rm "$SIGDIR/marker"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges -v "$SIGDIR:/var/lib/clamav:ro" --entrypoint node profitpilot-protected:ci --input-type=module -e 'import {scanSource} from "./server/malware.js"; import assert from "node:assert/strict"; assert.equal(await scanSource(Buffer.from("Ordinary harmless fixture"),{enabled:true}),"scanner_reported_clean"); assert.equal(await scanSource(Buffer.from("ProfitPilot harmless scanner test marker 2026"),{enabled:true}),"infected"); console.log("Native scanner accepted clean fixture and rejected custom harmless signature");'

  provenance:
    name: Source package, SBOM and signed provenance
    needs: [verify, database]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build source evidence and dependency inventory
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir release-evidence
          git archive --format=tar.gz --prefix=profitpilot/ "$GITHUB_SHA" > release-evidence/profitpilot-source.tar.gz
          npm sbom --sbom-format=cyclonedx --omit=dev > release-evidence/dependencies.cdx.json
          node -e 'const s=JSON.parse(require("fs").readFileSync("release-evidence/dependencies.cdx.json")); if(s.bomFormat!=="CycloneDX"||!s.components?.length)process.exit(1)'
          printf '%s\n' "$GITHUB_SHA" > release-evidence/COMMIT.txt
          (cd release-evidence && sha256sum profitpilot-source.tar.gz dependencies.cdx.json COMMIT.txt > SHA256SUMS && sha256sum -c SHA256SUMS)
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner -czf profitpilot-source-evidence.tar.gz -C release-evidence .
      - name: Sign source evidence provenance
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: profitpilot-source-evidence.tar.gz
      - name: Verify signed provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          gh attestation verify profitpilot-source-evidence.tar.gz --repo "$GITHUB_REPOSITORY" --bundle "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" profitpilot-attestation.jsonl
      - name: Retain buyer-verifiable source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profitpilot-source-evidence-${{ github.sha }}
          path: |
            profitpilot-source-evidence.tar.gz
            profitpilot-attestation.jsonl
          if-no-files-found: error
          retention-days: 30
