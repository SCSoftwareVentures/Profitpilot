name: ProfitPilot CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - integration/pr25-pr26-validation
      - feature/job-readiness-engine
      - feature/promise-ledger
      - feature/verified-value-ledger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profitpilot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check source credentials and locked dependency integrity
        run: node scripts/source-security-preflight.js

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit resolved production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify OpenAPI YAML structure and reject duplicate mapping keys
        run: |
          ruby -rpsych -e '
            doc=Psych.parse_file("api/openapi.yaml")
            visit=lambda do |node|
              if node.is_a?(Psych::Nodes::Mapping)
                keys=node.children.each_slice(2).map { |k,v| k.value }
                abort "Duplicate OpenAPI mapping key" unless keys.uniq.length==keys.length
              end
              (node.children || []).each { |child| visit.call(child) }
            end
            visit.call(doc)
            spec=Psych.safe_load_file("api/openapi.yaml",aliases:false)
            abort "Missing OpenAPI root fields" unless %w[openapi info paths components].all? { |key| spec.key?(key) }
          '

      - name: Syntax checks
        run: npm run check

      - name: Unit tests
        run: npm test

  database:
    name: PostgreSQL migrations and tenant RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: profitpilot
          POSTGRES_USER: profitpilot_admin
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profitpilot_admin -d profitpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Generate ephemeral tenant context signing key
        run: |
          TENANT_CONTEXT_HMAC_SECRET="$(openssl rand -hex 32)"
          POSTGRES_APP_PASSWORD="$(openssl rand -hex 32)"
          RATE_LIMIT_HASH_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$RATE_LIMIT_HASH_SECRET"
          echo "RATE_LIMIT_HASH_SECRET=$RATE_LIMIT_HASH_SECRET" >> "$GITHUB_ENV"
          echo "::add-mask::$TENANT_CONTEXT_HMAC_SECRET"
          echo "::add-mask::$POSTGRES_APP_PASSWORD"
          echo "TENANT_CONTEXT_HMAC_SECRET=$TENANT_CONTEXT_HMAC_SECRET" >> "$GITHUB_ENV"
          echo "POSTGRES_APP_PASSWORD=$POSTGRES_APP_PASSWORD" >> "$GITHUB_ENV"

      - name: Apply schema, runtime role and migrations
        env:
          PGPASSWORD: ci-admin-password
        run: |
          DB_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
          POSTGRES_APP_PASSWORD="$POSTGRES_APP_PASSWORD" psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/init/002-runtime-role.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/002_tenant_rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/init/003-tenant-context-key.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/003_allocation_lines.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/004_import_validation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/005_prevent_duplicate_confirmations.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/006_tenant_actor_membership_fks.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/007_users_self_rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/008_runtime_least_privilege.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/009_import_metadata_status.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/010_payroll_source_row_ledger.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/011_payroll_confirmation_integrity.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/012_contract_tax_basis.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/013_actor_authorization.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/014_match_decision_audit.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/015_shared_rate_limits.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/016_tenant_key_lifecycle.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/017_invoice_import_privacy.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/018_import_disposal_controls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/019_calculation_export.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/020_private_file_quarantine.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/021_quarantine_scanner_lifecycle.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/022_quarantine_content_validation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/023_identity_session_revocation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/024_audit_chain_integrity.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/025_identity_admin_recovery.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/026_quarantine_promotion.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/027_audit_checkpoint_reader.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/028_quarantine_expiry_recovery.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/029_private_privilege_boundary.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/030_invoice_batch_budget.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/031_minimized_financial_reads.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/032_financial_access_budgets.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/033_startup_key_attestation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/private-privilege.catalog.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/invoice-privacy.sql

      - name: Audit every tenant-scoped table and tenant-to-tenant foreign key
        env:
          PGPASSWORD: ci-admin-password
        run: psql "postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot" -v ON_ERROR_STOP=1 -f tests/tenant-isolation.catalog.sql

      - name: Verify tenant RLS with restricted runtime role
        env:
          PGPASSWORD: ci-admin-password
        run: |
          ADMIN_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot"
          APP_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO tenants(id,legal_name) VALUES ('11111111-1111-4111-8111-111111111111','CI tenant A'),('22222222-2222-4222-8222-222222222222','CI tenant B')"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -f tests/tenant-isolation.fixtures.sql
          psql "$APP_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM tenants) <> 0 THEN RAISE EXCEPTION 'RLS without tenant context did not deny rows'; END IF; END \$\$;"
          psql "$APP_URL" -v ON_ERROR_STOP=1 -c "BEGIN; SELECT set_config('app.tenant_id','11111111-1111-4111-8111-111111111111',true); DO \$\$ BEGIN IF (SELECT count(*) FROM tenants) <> 0 THEN RAISE EXCEPTION 'Raw tenant GUC must not grant access without a valid HMAC'; END IF; END \$\$; COMMIT;"

      - name: Run authenticated API integration tests
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" TEST_ADMIN_DATABASE_URL="$TEST_ADMIN_DATABASE_URL" node --test tests/api.integration.test.js
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" psql "postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" -v ON_ERROR_STOP=1 -f tests/tenant-isolation.runtime.sql

      - name: Verify signed audit checkpoints and alert policy
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/audit-checkpoint-monitor.test.js

      - name: Verify database-generated audit evidence and chain integrity
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/audit-integrity.integration.test.js

      - name: Verify restricted identity provisioning and account recovery
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/identity-admin.integration.test.js

      - name: Verify identity session revocation and fresh authentication
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/identity-session.integration.test.js

      - name: Verify security privilege gate rejects deliberately unsafe changes
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: node --test tests/privilege-drift-adversarial.integration.test.js

      - name: Verify distributed rate limiting and counter retention with real PostgreSQL
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/shared-rate-limit.test.js

      - name: Verify invoice batch resource budget under concurrent writes
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/invoice-capacity.integration.test.js

      - name: Stress shared security quotas and lock recovery
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/security-concurrency.integration.test.js

      - name: Verify guarded tenant key rotation and administrative audit
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/tenant-key-lifecycle.test.js

      - name: Verify legal holds, retention and controlled staging disposal
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/import-disposal.integration.test.js

      - name: Verify isolated scanner protocol, leases and hold-aware expiry
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/quarantine-scanner.test.js

      - name: Verify approved manifest-bound quarantine promotion
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/quarantine-promotion.integration.test.js

      - name: Verify encrypted private file quarantine and database authorization
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/quarantine.test.js

      - name: Verify minimized calculation exports and recent MFA
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/calculation-export.integration.test.js

      - name: Verify actor and tenant financial access budgets and audit chain
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/financial-access-budget.integration.test.js

      - name: Prepare quarantine expiry recovery fixture
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" node --test tests/quarantine-expiry-recovery.integration.test.js

      - name: Restore encrypted synthetic database backup and verify security after recovery
        env:
          PGPASSWORD: ci-admin-password
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          set -euo pipefail
          umask 077
          WORK="$(mktemp -d "$RUNNER_TEMP/profitpilot-restore-XXXXXX")"
          trap 'rm -rf "$WORK"' EXIT
          DUMP="$WORK/restored.dump"
          ARCHIVE="$WORK/backup.enc"
          export BACKUP_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$BACKUP_ENCRYPTION_KEY"
          PG_CONTAINER="$(docker ps --filter "ancestor=postgres:16-alpine" --format '{{.ID}}' | head -n 1)"
          test -n "$PG_CONTAINER"
          docker exec -e PGPASSWORD "$PG_CONTAINER" pg_dump -h 127.0.0.1 -U profitpilot_admin -Fc profitpilot | node scripts/secure-backup.js encrypt-stdin "$ARCHIVE"
          test -s "$ARCHIVE"
          node scripts/secure-backup.js decrypt "$ARCHIVE" "$DUMP"
          test -s "$DUMP"
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE profitpilot_restore_ci'
          docker exec -i -e PGPASSWORD "$PG_CONTAINER" pg_restore -h 127.0.0.1 -U profitpilot_admin --exit-on-error --single-transaction -d profitpilot_restore_ci < "$DUMP"
          RESTORE_ADMIN_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot_restore_ci"
          RESTORE_APP_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot_restore_ci"
          psql "$RESTORE_ADMIN_URL" -v ON_ERROR_STOP=1 -f tests/tenant-isolation.catalog.sql
          psql "$RESTORE_ADMIN_URL" -v ON_ERROR_STOP=1 -f tests/private-privilege.catalog.sql
          psql "$RESTORE_APP_URL" -v ON_ERROR_STOP=1 -f tests/tenant-isolation.runtime.sql
          TEST_RESTORE_ADMIN_DATABASE_URL="$RESTORE_ADMIN_URL" TEST_RESTORE_APP_DATABASE_URL="$RESTORE_APP_URL" node --test tests/backup-restore.integration.test.js
          psql "$TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP DATABASE profitpilot_restore_ci'

      - name: Build production API image
        run: docker build --pull -t profitpilot-api:ci .

      - name: Enable verified TLS on ephemeral PostgreSQL
        env:
          PGPASSWORD: ci-admin-password
        run: |
          set -eu
          CERT="$RUNNER_TEMP/profitpilot-postgres.crt"
          KEY="$RUNNER_TEMP/profitpilot-postgres.key"
          openssl req -new -x509 -newkey rsa:2048 -nodes -days 1 -keyout "$KEY" -out "$CERT" -subj "/CN=localhost" -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" -addext "basicConstraints=critical,CA:TRUE"
          PG_CONTAINER="$(docker ps --filter "ancestor=postgres:16-alpine" --format '{{.ID}}' | head -n 1)"
          test -n "$PG_CONTAINER"
          docker cp "$CERT" "$PG_CONTAINER:/var/lib/postgresql/data/server.crt"
          docker cp "$KEY" "$PG_CONTAINER:/var/lib/postgresql/data/server.key"
          docker exec -u root "$PG_CONTAINER" chown postgres:postgres /var/lib/postgresql/data/server.crt /var/lib/postgresql/data/server.key
          docker exec -u root "$PG_CONTAINER" chmod 600 /var/lib/postgresql/data/server.key
          ADMIN_URL="postgresql://profitpilot_admin:ci-admin-password@127.0.0.1:5432/profitpilot"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl='on'"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_cert_file='server.crt'"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_key_file='server.key'"
          docker restart "$PG_CONTAINER"
          for attempt in $(seq 1 30); do
            if psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "SHOW ssl" | grep -q on; then break; fi
            sleep 2
          done
          psql "$ADMIN_URL?sslmode=require" -v ON_ERROR_STOP=1 -c "SHOW ssl" | grep -q on
          {
            echo 'DATABASE_SSL_CA<<PROFITPILOT_CA'
            cat "$CERT"
            echo 'PROFITPILOT_CA'
          } >> "$GITHUB_ENV"

      - name: Verify PostgreSQL TLS certificate validation
        env:
          DATABASE_SSL_TEST_URL: postgresql://profitpilot_app:${{ env.POSTGRES_APP_PASSWORD }}@127.0.0.1:5432/profitpilot
        run: node --test tests/db-tls.integration.test.js

      - name: Start production-mode container and verify database TLS health endpoint
        env:
          CORS_ORIGIN: https://ci.invalid
          AUTH_ISSUER: https://profitpilot-ci.invalid/
          AUTH_AUDIENCE: profitpilot-api
          AUTH_JWKS_URL: https://profitpilot-ci.invalid/.well-known/jwks.json
        run: |
          set -eu
          DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@127.0.0.1:5432/profitpilot"
          docker run -d --network host --name profitpilot-api-ci --init --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=100 --tmpfs /tmp:rw,noexec,nosuid,size=64m -e NODE_ENV=production -e PORT=8080 -e DATABASE_URL="$DATABASE_URL" -e DATABASE_SSL=true -e DATABASE_SSL_CA -e CORS_ORIGIN="$CORS_ORIGIN" -e AUTH_ISSUER="$AUTH_ISSUER" -e AUTH_AUDIENCE="$AUTH_AUDIENCE" -e AUTH_JWKS_URL="$AUTH_JWKS_URL" -e TENANT_CONTEXT_HMAC_SECRET="$TENANT_CONTEXT_HMAC_SECRET" -e RATE_LIMIT_HASH_SECRET profitpilot-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health | grep -q '"database":"connected"'; then
              echo 'Production-mode verified database TLS health check passed'
              docker rm -f profitpilot-api-ci
              exit 0
            fi
            sleep 2
          done
          docker logs profitpilot-api-ci
          docker rm -f profitpilot-api-ci
          exit 1


  security-gate:
    name: Security CI release gate
    runs-on: ubuntu-latest
    needs: [verify, database]
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: Require successful application and database security checks
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          echo "Security verification commit: $TESTED_SHA"
          echo "Node/application verification: $VERIFY_RESULT"
          echo "PostgreSQL/API/RLS/TLS verification: $DATABASE_RESULT"
          test "$VERIFY_RESULT" = success
          test "$DATABASE_RESULT" = success
          {
            echo "## ProfitPilot security CI gate"
            echo "- Commit: \`$TESTED_SHA\`"
            echo "- Node.js application checks: $VERIFY_RESULT"
            echo "- PostgreSQL, tenant RLS, identity/session revocation, audit chains/checkpoints, authenticated API, distributed limits, key lifecycle, invoice privacy boundary, retention/holds/disposal, MFA-gated export, encrypted file quarantine, scanner protocol, strict CSV preflight, approved manifest promotion and expiry, encrypted synthetic recovery and revocation/tombstone replay, TLS and container checks: $DATABASE_RESULT"
            echo "- Scope: automated repository CI only; not penetration testing or production certification"
          } >> "$GITHUB_STEP_SUMMARY"
