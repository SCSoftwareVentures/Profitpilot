name: ProfitPilot CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profitpilot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit production dependencies for high-severity vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax checks
        run: npm run check

      - name: Unit tests
        run: npm test

  database:
    name: PostgreSQL migrations and tenant RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: profitpilot
          POSTGRES_USER: profitpilot_admin
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profitpilot_admin -d profitpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate ephemeral tenant context signing key
        run: |
          echo "TENANT_CONTEXT_HMAC_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Apply schema, runtime role and migrations
        env:
          PGPASSWORD: ci-admin-password
        run: |
          DB_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
          POSTGRES_APP_PASSWORD="$POSTGRES_APP_PASSWORD" psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/init/002-runtime-role.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/002_tenant_rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/init/003-tenant-context-key.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/003_allocation_lines.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/004_import_validation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/005_prevent_duplicate_confirmations.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/006_tenant_actor_membership_fks.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/007_users_self_rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/008_granular_permissions.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/009_auth_session_registry.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/010_audit_and_security_admin.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/011_privacy_request_workflow.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/012_privacy_subject_isolation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/013_privacy_account_confirmation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/014_privacy_account_export.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/015_privacy_export_coverage.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/016_privacy_controlled_redaction.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/017_privacy_approval_invalidation.sql

      - name: Verify tenant RLS with restricted runtime role
        env:
          PGPASSWORD: ci-admin-password
        run: |
          ADMIN_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot"
          APP_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO tenants(id,legal_name) VALUES ('11111111-1111-4111-8111-111111111111','CI tenant A'),('22222222-2222-4222-8222-222222222222','CI tenant B')"
          psql "$APP_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM tenants) <> 0 THEN RAISE EXCEPTION 'RLS without tenant context did not deny rows'; END IF; END \$\$;"
          psql "$APP_URL" -v ON_ERROR_STOP=1 -c "BEGIN; SELECT set_config('app.tenant_id','11111111-1111-4111-8111-111111111111',true); DO \$\$ BEGIN IF (SELECT count(*) FROM tenants) <> 0 THEN RAISE EXCEPTION 'Raw tenant GUC must not grant access without a valid HMAC'; END IF; END \$\$; COMMIT;"

      - name: Run authenticated API integration tests
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
        run: |
          npm install --no-audit --no-fund
          TEST_APP_DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@localhost:5432/profitpilot" TEST_ADMIN_DATABASE_URL="$TEST_ADMIN_DATABASE_URL" node --test tests/api.integration.test.js

      - name: Verify production database TLS configuration fails closed
        run: |
          set -eu
          if NODE_ENV=production DATABASE_SSL=false DATABASE_URL="postgresql://profitpilot:placeholder@127.0.0.1:5432/profitpilot" node --input-type=module -e "await import('./server/db.js')" >tls-check.log 2>&1; then
            echo "Production database configuration unexpectedly accepted plaintext connections"
            exit 1
          fi
          grep -q "DATABASE_SSL=true is required in production" tls-check.log
          NODE_ENV=production DATABASE_SSL=true DATABASE_URL="postgresql://profitpilot:placeholder@127.0.0.1:5432/profitpilot" node --input-type=module -e "await import('./server/db.js')"
          echo "Production startup rejects disabled TLS and accepts verified-TLS configuration"

      - name: Build production API image
        run: docker build --pull -t profitpilot-api:ci .

      - name: Verify production image runs as non-root
        run: |
          set -eu
          image_user="$(docker image inspect profitpilot-api:ci --format '{{.Config.User}}')"
          if [ "$image_user" != "node" ]; then
            echo "Production image must run as the non-root node user; got: $image_user" >&2
            exit 1
          fi
          echo "Production image declares non-root node user"

      - name: Start container and verify database health endpoint (CI test configuration)
        env:
          CORS_ORIGIN: https://ci.invalid
          AUTH_ISSUER: https://profitpilot-ci.invalid/
          AUTH_AUDIENCE: profitpilot-api
          AUTH_JWKS_URL: https://profitpilot-ci.invalid/.well-known/jwks.json
        run: |
          set -eu
          DATABASE_URL="postgresql://profitpilot_app:${POSTGRES_APP_PASSWORD}@127.0.0.1:5432/profitpilot"
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker ps -a --filter name=profitpilot-api-ci; docker logs profitpilot-api-ci 2>&1 || true; fi; docker rm -f profitpilot-api-ci >/dev/null 2>&1 || true' EXIT
          # NODE_ENV=test deliberately disables app.listen() for unit tests; use ci for the running-container smoke test.
          docker run -d --network host --name profitpilot-api-ci -e NODE_ENV=ci -e PORT=8080 -e DATABASE_URL="$DATABASE_URL" -e DATABASE_SSL=false -e CORS_ORIGIN="$CORS_ORIGIN" -e AUTH_ISSUER="$AUTH_ISSUER" -e AUTH_AUDIENCE="$AUTH_AUDIENCE" -e AUTH_JWKS_URL="$AUTH_JWKS_URL" -e TENANT_CONTEXT_HMAC_SECRET="$TENANT_CONTEXT_HMAC_SECRET" profitpilot-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health | grep -q '"database":"connected"'; then
              echo 'Production container health check passed'
              exit 0
            fi
            sleep 2
          done
          echo 'Container did not report a connected database after 60 seconds' >&2
          exit 1
