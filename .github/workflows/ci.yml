name: ProfitPilot CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profitpilot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        run: npm run check

      - name: Unit tests
        run: npm test

  database:
    name: PostgreSQL migrations and tenant RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: profitpilot
          POSTGRES_USER: profitpilot_admin
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profitpilot_admin -d profitpilot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply schema, runtime role and migrations
        env:
          PGPASSWORD: ci-admin-password
        run: |
          DB_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/schema.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/init/002-runtime-role.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/002_tenant_rls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/003_allocation_lines.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/004_import_validation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f database/migrations/005_prevent_duplicate_confirmations.sql

      - name: Verify tenant RLS with restricted runtime role
        env:
          PGPASSWORD: ci-admin-password
        run: |
          ADMIN_URL="postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot"
          APP_URL="postgresql://profitpilot_app:local-dev-only-change-this@localhost:5432/profitpilot"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "INSERT INTO tenants(id,legal_name) VALUES ('11111111-1111-4111-8111-111111111111','CI tenant A'),('22222222-2222-4222-8222-222222222222','CI tenant B')"
          psql "$APP_URL" -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF (SELECT count(*) FROM tenants) <> 0 THEN RAISE EXCEPTION 'RLS without tenant context did not deny rows'; END IF; END \$\$;"
          psql "$APP_URL" -v ON_ERROR_STOP=1 -c "BEGIN; SELECT set_config('app.tenant_id','11111111-1111-4111-8111-111111111111',true); DO \$\$ BEGIN IF (SELECT count(*) FROM tenants) <> 1 THEN RAISE EXCEPTION 'RLS tenant scope leaked or hid tenant A'; END IF; END \$\$; COMMIT;"

      - name: Run authenticated API integration tests
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://profitpilot_admin:ci-admin-password@localhost:5432/profitpilot
          TEST_APP_DATABASE_URL: postgresql://profitpilot_app:local-dev-only-change-this@localhost:5432/profitpilot
        run: |
          npm install --no-audit --no-fund
          TEST_ADMIN_DATABASE_URL="$TEST_ADMIN_DATABASE_URL" TEST_APP_DATABASE_URL="$TEST_APP_DATABASE_URL" node --test tests/api.integration.test.js

      - name: Build production API image
        run: docker build --pull -t profitpilot-api:ci .

      - name: Start container and verify database health endpoint
        env:
          DATABASE_URL: postgresql://profitpilot_app:local-dev-only-change-this@127.0.0.1:5432/profitpilot
          CORS_ORIGIN: https://ci.invalid
          AUTH_ISSUER: https://profitpilot-ci.invalid/
          AUTH_AUDIENCE: profitpilot-api
          AUTH_JWKS_URL: https://profitpilot-ci.invalid/.well-known/jwks.json
        run: |
          set -eu
          docker run -d --network host --name profitpilot-api-ci -e NODE_ENV=production -e PORT=8080 -e DATABASE_URL="$DATABASE_URL" -e DATABASE_SSL=false -e CORS_ORIGIN="$CORS_ORIGIN" -e AUTH_ISSUER="$AUTH_ISSUER" -e AUTH_AUDIENCE="$AUTH_AUDIENCE" -e AUTH_JWKS_URL="$AUTH_JWKS_URL" profitpilot-api:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health | grep -q '"database":"connected"'; then
              echo 'Production container health check passed'
              docker rm -f profitpilot-api-ci
              exit 0
            fi
            sleep 2
          done
          docker logs profitpilot-api-ci
          docker rm -f profitpilot-api-ci
          exit 1
