name: SecurePay domain tests
on:
  pull_request:
    paths:
      - 'securepay/**'
      - '.github/workflows/securepay-domain.yml'
  push:
    branches: [main]
    paths:
      - 'securepay/**'
jobs:
  state-machine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run SecurePay domain tests
        run: node --experimental-strip-types --test securepay/domain/*.test.mjs
