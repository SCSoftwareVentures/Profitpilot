services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: profitpilot
      POSTGRES_USER: profitpilot_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      TENANT_CONTEXT_HMAC_SECRET: ${TENANT_CONTEXT_HMAC_SECRET:?Set TENANT_CONTEXT_HMAC_SECRET}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - profitpilot_pg:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/init/002-runtime-role.sql:/docker-entrypoint-initdb.d/002-runtime-role.sql:ro
      - ./database/migrations/002_tenant_rls.sql:/docker-entrypoint-initdb.d/003-tenant-rls.sql:ro
      - ./database/init/003-tenant-context-key.sql:/docker-entrypoint-initdb.d/004-tenant-context-key.sql:ro
      - ./database/migrations/003_allocation_lines.sql:/docker-entrypoint-initdb.d/005-allocation-lines.sql:ro
      - ./database/migrations/004_import_validation.sql:/docker-entrypoint-initdb.d/006-import-validation.sql:ro
      - ./database/migrations/005_prevent_duplicate_confirmations.sql:/docker-entrypoint-initdb.d/007-confirmation-uniqueness.sql:ro
      - ./database/migrations/006_tenant_actor_membership_fks.sql:/docker-entrypoint-initdb.d/008-tenant-actor-fks.sql:ro
      - ./database/migrations/007_users_self_rls.sql:/docker-entrypoint-initdb.d/009-users-self-rls.sql:ro
      - ./database/migrations/008_runtime_least_privilege.sql:/docker-entrypoint-initdb.d/010-runtime-least-privilege.sql:ro
      - ./database/migrations/009_payroll_source_lineage.sql:/docker-entrypoint-initdb.d/011-payroll-source-lineage.sql:ro
      - ./database/migrations/010_payroll_allocation_integrity.sql:/docker-entrypoint-initdb.d/012-payroll-allocation-integrity.sql:ro
      - ./database/migrations/011_source_file_receipts.sql:/docker-entrypoint-initdb.d/013-source-file-receipts.sql:ro
      - ./database/migrations/012_invoice_identity_claims.sql:/docker-entrypoint-initdb.d/014-invoice-identity-claims.sql:ro
      - ./database/migrations/013_runtime_actor_policies.sql:/docker-entrypoint-initdb.d/015-runtime-actor-policies.sql:ro
      - ./database/migrations/014_privacy_requests.sql:/docker-entrypoint-initdb.d/016-privacy-requests.sql:ro
      - ./database/migrations/015_scan_receipts.sql:/docker-entrypoint-initdb.d/017-scan-receipts.sql:ro
      - ./database/migrations/016_narrow_privacy_disposal.sql:/docker-entrypoint-initdb.d/018-narrow-disposal.sql:ro
      - ./database/migrations/017_invoice_confirmation_rehearsal.sql:/docker-entrypoint-initdb.d/019-invoice-rehearsal.sql:ro
      - ./database/migrations/018_payroll_contract_rehearsal.sql:/docker-entrypoint-initdb.d/020-payroll-contract-rehearsal.sql:ro
      - ./database/migrations/019_privacy_audit_and_index.sql:/docker-entrypoint-initdb.d/021-privacy-audit.sql:ro
      - ./database/migrations/020_audit_privacy_least_privilege.sql:/docker-entrypoint-initdb.d/022-audit-privacy-least-privilege.sql:ro
      - ./database/migrations/021_privacy_case_dual_review.sql:/docker-entrypoint-initdb.d/023-privacy-dual-review.sql:ro
      - ./database/migrations/022_privacy_case_evidence_gate.sql:/docker-entrypoint-initdb.d/024-privacy-evidence-gate.sql:ro
      - ./database/migrations/023_calculation_restatement.sql:/docker-entrypoint-initdb.d/025-calculation-restatement.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profitpilot_admin -d profitpilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PROFITPILOT_PROFILE: prototype
      PORT: 8080
      DATABASE_URL: postgres://profitpilot_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@db:5432/profitpilot
      DATABASE_SSL: "false"
      TENANT_CONTEXT_HMAC_SECRET: ${TENANT_CONTEXT_HMAC_SECRET:?Set TENANT_CONTEXT_HMAC_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
      AUTH_ISSUER: ${AUTH_ISSUER:?Set AUTH_ISSUER}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:?Set AUTH_AUDIENCE}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:?Set AUTH_JWKS_URL}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
volumes:
  profitpilot_pg:
