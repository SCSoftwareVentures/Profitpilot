services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: profitpilot
      POSTGRES_USER: profitpilot_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
      TENANT_CONTEXT_HMAC_SECRET: ${TENANT_CONTEXT_HMAC_SECRET:?Set TENANT_CONTEXT_HMAC_SECRET}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - profitpilot_pg:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/init/002-runtime-role.sql:/docker-entrypoint-initdb.d/002-runtime-role.sql:ro
      - ./database/migrations/002_tenant_rls.sql:/docker-entrypoint-initdb.d/003-tenant-rls.sql:ro
      - ./database/init/003-tenant-context-key.sql:/docker-entrypoint-initdb.d/004-tenant-context-key.sql:ro
      - ./database/migrations/003_allocation_lines.sql:/docker-entrypoint-initdb.d/005-allocation-lines.sql:ro
      - ./database/migrations/004_import_validation.sql:/docker-entrypoint-initdb.d/006-import-validation.sql:ro
      - ./database/migrations/005_prevent_duplicate_confirmations.sql:/docker-entrypoint-initdb.d/007-confirmation-uniqueness.sql:ro
      - ./database/migrations/006_tenant_actor_membership_fks.sql:/docker-entrypoint-initdb.d/008-tenant-actor-fks.sql:ro
      - ./database/migrations/007_users_self_rls.sql:/docker-entrypoint-initdb.d/009-users-self-rls.sql:ro
      - ./database/migrations/008_granular_permissions.sql:/docker-entrypoint-initdb.d/010-granular-permissions.sql:ro
      - ./database/migrations/009_auth_session_registry.sql:/docker-entrypoint-initdb.d/011-auth-sessions.sql:ro
      - ./database/migrations/010_audit_and_security_admin.sql:/docker-entrypoint-initdb.d/012-audit-admin.sql:ro
      - ./database/migrations/011_privacy_request_workflow.sql:/docker-entrypoint-initdb.d/013-privacy-workflow.sql:ro
      - ./database/migrations/012_privacy_subject_isolation.sql:/docker-entrypoint-initdb.d/014-privacy-isolation.sql:ro
      - ./database/migrations/013_privacy_account_confirmation.sql:/docker-entrypoint-initdb.d/015-privacy-confirmation.sql:ro
      - ./database/migrations/014_privacy_account_export.sql:/docker-entrypoint-initdb.d/016-privacy-export.sql:ro
      - ./database/migrations/015_privacy_export_coverage.sql:/docker-entrypoint-initdb.d/017-export-coverage.sql:ro
      - ./database/migrations/016_privacy_controlled_redaction.sql:/docker-entrypoint-initdb.d/018-controlled-redaction.sql:ro
      - ./database/migrations/017_privacy_approval_invalidation.sql:/docker-entrypoint-initdb.d/019-approval-invalidation.sql:ro
      - ./database/migrations/018_account_closure.sql:/docker-entrypoint-initdb.d/020-account-closure.sql:ro
      - ./database/migrations/019_privacy_restore_safeguards.sql:/docker-entrypoint-initdb.d/021-privacy-restore.sql:ro
      - ./database/migrations/020_multi_tenant_account_closure.sql:/docker-entrypoint-initdb.d/022-multi-tenant-closure.sql:ro
      - ./database/migrations/021_closed_session_retention.sql:/docker-entrypoint-initdb.d/023-closed-session-retention.sql:ro
      - ./database/migrations/022_provider_erasure_authorization.sql:/docker-entrypoint-initdb.d/024-provider-erasure.sql:ro
      - ./database/migrations/023_identity_issuer_binding.sql:/docker-entrypoint-initdb.d/025-issuer-binding.sql:ro
      - ./database/migrations/024_discarded_import_retention.sql:/docker-entrypoint-initdb.d/026-import-retention.sql:ro
      - ./database/migrations/025_runtime_acl_and_catalog_guard.sql:/docker-entrypoint-initdb.d/027-runtime-acl-guard.sql:ro
      - ./database/migrations/026_payroll_allocation_approval.sql:/docker-entrypoint-initdb.d/028-payroll-approval.sql:ro
      - ./database/migrations/027_shared_overhead_immutability.sql:/docker-entrypoint-initdb.d/029-shared-overhead.sql:ro
      - ./database/migrations/028_shared_overhead_proposals.sql:/docker-entrypoint-initdb.d/030-shared-proposals.sql:ro
      - ./database/migrations/029_exact_access_session_binding.sql:/docker-entrypoint-initdb.d/031-exact-session-binding.sql:ro
      - ./database/migrations/030_privacy_read_minimisation.sql:/docker-entrypoint-initdb.d/032-privacy-read-minimisation.sql:ro
      - ./database/migrations/031_audit_read_isolation.sql:/docker-entrypoint-initdb.d/033-audit-read-isolation.sql:ro
      - ./database/migrations/032_signed_audit_writes.sql:/docker-entrypoint-initdb.d/034-signed-audit-writes.sql:ro
      - ./database/migrations/033_csv_ingestion_audit.sql:/docker-entrypoint-initdb.d/035-csv-ingestion-audit.sql:ro
      - ./database/migrations/034_signing_key_lifecycle.sql:/docker-entrypoint-initdb.d/036-signing-key-lifecycle.sql:ro
      - ./database/migrations/035_local_profile_correction.sql:/docker-entrypoint-initdb.d/037-local-profile-correction.sql:ro
      - ./database/migrations/036_encrypted_attachment_quarantine.sql:/docker-entrypoint-initdb.d/038-encrypted-attachment-quarantine.sql:ro
      - ./database/migrations/037_source_ingestion_restriction.sql:/docker-entrypoint-initdb.d/039-source-ingestion-restriction.sql:ro
      - ./database/migrations/038_reviewed_permission_changes.sql:/docker-entrypoint-initdb.d/040-reviewed-permissions.sql:ro
      - ./database/migrations/039_verified_session_operations.sql:/docker-entrypoint-initdb.d/041-verified-sessions.sql:ro
      - ./database/migrations/040_permission_read_isolation.sql:/docker-entrypoint-initdb.d/042-permission-read-isolation.sql:ro
      - ./database/migrations/041_account_session_revocation.sql:/docker-entrypoint-initdb.d/043-account-session-revocation.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profitpilot_admin -d profitpilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    environment:
      # Local-only Compose; production TLS configuration is separate.
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://profitpilot_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}@db:5432/profitpilot
      DATABASE_SSL: "false"
      TENANT_CONTEXT_HMAC_SECRET: ${TENANT_CONTEXT_HMAC_SECRET:?Set TENANT_CONTEXT_HMAC_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
      AUTH_ISSUER: ${AUTH_ISSUER:?Set AUTH_ISSUER}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:?Set AUTH_AUDIENCE}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:?Set AUTH_JWKS_URL}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
volumes:
  profitpilot_pg:
