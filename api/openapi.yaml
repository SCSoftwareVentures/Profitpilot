        "403": { description: Reviewer role required }
        "404": { description: Batch unavailable }
        "409": { description: Duplicate source or batch already reconciled }
        "422": { description: Held source rows, invalid allocation or total mismatch }
  /tenants/{tenantId}/matches/{matchId}/decision:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: matchId
        in: path
