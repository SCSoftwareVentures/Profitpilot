openapi: 3.1.0
info:
  title: ProfitPilot Core API
  version: 0.1.0
  description: Contract-economics prototype API contract. Specification only; no server is deployed.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder only — not a live endpoint
security:
  - bearerAuth: []
paths:
  /me:
    get:
      summary: Resolve authenticated identity (membership discovery not exposed)
      responses:
        "200": { description: Verified identity only; membership discovery requires a separately reviewed endpoint. }
        "401": { description: Unauthenticated }
  /tenants/{tenantId}/privacy/self-access:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      summary: Download own stored identity, current membership and up to 200 own privacy cases
      description: Not a complete data-subject export. Does not expose raw source evidence or other members' details.
      responses:
        "200": { description: Non-persistent JSON attachment; additional case flag when truncated }
        "403": { description: Active membership required }
  /tenants/{tenantId}/privacy-requests:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      summary: List permitted privacy cases for the current member or tenant administrator
      responses:
        "200": { description: Bounded case metadata }
    post:
      summary: Record a self-service privacy request without personal details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientRequestId, requestType]
              properties:
                clientRequestId: { type: string, format: uuid }
                requestType: { type: string, enum: [access, correction, erasure, restriction] }
      responses:
        "201": { description: Request recorded }
        "200": { description: Identical replay }
        "409": { description: Conflicting identifier }
  /tenants/{tenantId}/privacy-requests/{requestId}/review:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Record independent administrator review, not automated fulfilment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reviewReference]
              properties:
                status: { type: string, enum: [reviewing, closed_attested, declined] }
                reviewReference: { type: string, minLength: 3, maxLength: 120 }
      responses:
        "200": { description: Review recorded; external fulfilment unverified }
        "403": { description: Admin role required }
        "409": { description: Invalid transition, self-review or unavailable case }
  /tenants/{tenantId}/contracts:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      summary: List contracts visible to the verified tenant member
      responses:
        "200": { description: Contract list }
        "403": { description: Tenant membership or role not authorised }
  /tenants/{tenantId}/prototype/invoice-identity-preview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Classify synthetic invoice identity conflicts without persistence
      description: Owner, admin, analyst or reviewer only. All members of exact or potential alias conflicts are held. This preview cannot authenticate issuers, confirm invoices or authorise financial inclusion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [synthetic, rows]
              properties:
                synthetic: { const: true }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      direction: { type: string, maxLength: 200 }
                      issuerKey: { type: string, maxLength: 200 }
                      invoiceReference: { type: string, maxLength: 200 }
      responses:
        "200": { description: Ordered candidate or held rows; synthetic true, issuerAuthenticated false, automaticallyAccepted zero }
        "400": { description: Invalid synthetic input }
        "401": { description: Unauthenticated }
        "403": { description: Tenant membership or role not authorised }
  /tenants/{tenantId}/imports:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Create an import batch from an authorised source file
      description: Membership and metadata are checked. The SHA-256 and permission reference are client declarations; original file bytes are not independently verified. Identical metadata retries are idempotent; conflicting metadata is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceType, fileName, sha256, permissionReference, periodStart, periodEnd]
              properties:
                sourceType: { type: string, enum: [payroll, customer_invoice, supplier_invoice] }
                fileName: { type: string, maxLength: 255 }
                sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
                permissionReference: { type: string, minLength: 1 }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
      responses:
        "201": { description: Batch created }
        "200": { description: Identical metadata replay; existing batch returned }
        "400": { description: Invalid metadata }
        "403": { description: Permission or role not sufficient }
        "409": { description: Conflicting duplicate or period }
  /tenants/{tenantId}/imports/{batchId}/file:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Verify and ingest original CSV bytes atomically
      description: Uncompressed UTF-8 CSV only, 512 KiB and 2000 rows maximum, exact allowlisted headers. Requires empty uploaded batch and SHA-256 match. Original bytes retained with runtime metadata-only read access. Digest is not proof of issuer identity.
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
      responses:
        "201": { description: Verified source receipt created }
        "200": { description: Identical file replay }
        "403": { description: Not authorised }
        "404": { description: Batch unavailable }
        "409": { description: Existing rows or closed batch }
        "413": { description: File too large }
        "415": { description: Unsupported format or encoding }
        "422": { description: Malformed CSV or checksum mismatch }
  /tenants/{tenantId}/imports/{batchId}/source:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    get:
      summary: Read source integrity receipt without original file contents
      responses:
        "200": { description: Byte-verified or client-declared status, issuer not authenticated }
        "404": { description: Batch unavailable }
  /tenants/{tenantId}/imports/{batchId}/rows:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Persist parsed invoice row objects for a source batch
      description: Accepts 1–200 contiguous JSON row objects per request, maximum 2000 per batch. Exact JSONB-equivalent replays are idempotent; differing overlaps or new rows after validation are rejected atomically. Client-side parsing only. Source-specific scalar fields only (bounded strings or null); unknown fields, nested values and controls rejected with 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                startRow: { type: integer, minimum: 1, maximum: 2000, default: 1 }
                rows: { type: array, minItems: 1, maxItems: 200, items: { type: object } }
      responses:
        "201": { description: New rows persisted }
        "200": { description: Exact row replay }
        "409": { description: Conflicting content, gap, or sealed batch }
        "400": { description: Invalid row payload }
        "403": { description: Not authorised }
        "404": { description: Batch not found }
  /tenants/{tenantId}/imports/{batchId}/validate:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Validate invoice or payroll source rows and produce held/review candidates
      responses:
        "200": { description: Structural validation results; existing human decisions preserved }
        "409": { description: Invalid batch state or inconsistent row numbering }
        "422": { description: No rows or unsupported source type }
        "403": { description: Not authorised }
        "404": { description: Batch not found in this tenant }
  /tenants/{tenantId}/imports/{batchId}/invoice-identities:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    get:
      summary: Inspect invoice source rows and potential cross-batch reference conflicts
      description: Owner, admin, analyst or reviewer only. Counts other batches with potential reference aliases in the same direction, not verified issuer duplicates.
      responses:
        "200": { description: Review rows, source lineage and identity reservations }
        "403": { description: Role denied }
        "404": { description: Batch unavailable }
        "422": { description: Invoice batch required }
    post:
      summary: Reserve a reviewer-attested issuer and invoice reference
      description: Owner, admin or reviewer only. Unique per tenant, direction, issuer and reference including conservative alias collision guard. No issuer authentication or financial inclusion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rowNumber, issuerKey, evidenceReference, reason]
              properties:
                rowNumber: { type: integer, minimum: 1, maximum: 2000 }
                issuerKey: { type: string, pattern: '^[a-z0-9][a-z0-9._:-]{0,199}
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Human-confirm payroll against a reviewer-attested control total
      description: Owner, admin or reviewer only. Source rows require stable tenant-unique source_ref, decimal amount string, currency and exact batch period_start/period_end. Whole-row assignment remains supported; multiple distinct destinations require explicit decimal amount strings. Unassigned amounts remain unallocated. Database confirmation checks each source, line and bucket total.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [controlTotal, currency, controlReference, reason]
              properties:
                controlTotal: { type: string }
                currency: { type: string }
                controlReference: { type: string, maxLength: 200 }
                reason: { type: string, minLength: 3, maxLength: 2000 }
                assignments:
                  type: array
                  maxItems: 2000
                  items:
                    type: object
                    required: [rowNumber, bucket, reason]
                    properties:
                      rowNumber: { type: integer, minimum: 1 }
                      amount: { type: string, description: Positive decimal split amount; omit only for whole-row assignment }
                      bucket: { type: string, enum: [direct, approved_allocated, non_site, excluded] }
                      siteId: { type: string, format: uuid }
                      reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "201": { description: Pool, allocation run and source lineage created atomically }
        "403": { description: Reviewer role required }
        "404": { description: Batch unavailable }
        "409": { description: Duplicate source or batch already reconciled }
        "422": { description: Held source rows, invalid allocation or total mismatch }
  /tenants/{tenantId}/matches/{matchId}/decision:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: matchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Record a human invoice-match decision
      description: Candidate scores never auto-confirm a match. Append reviewer, reason and timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [confirmed, rejected, held] }
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        "201": { description: Decision appended }
        "403": { description: Reviewer role required }
        "409": { description: Match state changed; refresh required }
  /tenants/{tenantId}/prototype/invoice-confirmations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Confirm an invoice in an isolated synthetic rehearsal registry
      description: Requires explicitly provisioned synthetic tenant, prototype profile, reviewer, existing identity claim and approved contract/site/service period. Currency AUD and tax basis are reviewer assertions, not issuer-authenticated. Does not promote invoices or authorise financial inclusion.
      responses:
        "201": { description: Rehearsal created with audit event }
        "200": { description: Identical replay }
        "403": { description: Reviewer or rehearsal provisioning missing }
        "409": { description: Conflict }
        "422": { description: Invalid evidence }
  /tenants/{tenantId}/prototype/invoice-cost-bridge:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Preview revenue less supplier and subcontractor invoice costs
      description: Synthetic only; exact decimal amounts and input digest; excludes payroll and unconfirmed costs, does not modify the management calculation ledger.
      responses:
        "200": { description: Incomplete synthetic invoice-only bridge }
        "403": { description: Synthetic rehearsal not provisioned }
        "422": { description: Inconsistent or insufficient evidence }
  /tenants/{tenantId}/prototype/payroll-attributions:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Rehearse reviewer-confirmed contract attribution of one whole payroll allocation line
      description: Default-off synthetic tenant only. Requires accepted, confirmed source-linked v2 site allocation, approved covering contract and evidence reference. Amount and scope derive from database. One whole allocation may be assigned once.
      responses:
        "201": { description: Attribution created with audit event }
        "200": { description: Identical replay }
        "403": { description: Rehearsal or reviewer not authorised }
        "409": { description: Attribution conflict }
        "422": { description: Source or scope invalid }
  /tenants/{tenantId}/prototype/unified-contribution:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Exact incomplete synthetic contribution across reviewed invoice and payroll evidence
      description: Read-only repeatable-read snapshot and SHA-256; rejects unattributed confirmed v2 payroll, partial periods and inconsistent contract version. Explicitly excludes legacy payroll. No production inclusion or persisted report.
      responses:
        "200": { description: Exact contribution, evidence and limitations }
        "403": { description: Synthetic rehearsal not provisioned }
        "422": { description: Insufficient or incompatible evidence }
  /tenants/{tenantId}/privacy-requests/{requestId}/evidence:
    get:
      summary: Read case-specific scoped operator evidence references
      description: Requester or authorised tenant administrator only. Not independently verified evidence of deletion, export, processor action or legal completion.
      responses:
        "200": { description: Scoped reference list and explicit non-verification flag }
        "404": { description: Not a visible privacy case }
  /tenants/{tenantId}/calculations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Create a versioned contract/site/period calculation run
      description: Formula 0.2.0 calculates exact decimal strings from bounded confirmed invoice and payroll evidence in a repeatable-read transaction. Invoice date and reviewed service period must align. Saves an immutable evidence snapshot and SHA-256 digest; numeric compatibility values are non-authoritative. Incomplete management contribution only; no issuer authentication or full cost coverage.
      responses:
        "201": { description: Calculation run created }
        "422": { description: Insufficient or unreconciled source evidence }
  /tenants/{tenantId}/calculations/{runId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Retrieve immutable calculation output and coverage limitations
      responses:
        "200": { description: Calculation output }
        "404": { description: Run not found in this tenant }
components:
