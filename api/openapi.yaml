                sourceNamespace: { type: string, format: uuid }
                controlTotal: { type: string, pattern: '^(0|[1-9][0-9]{0,11})[.][0-9]{2}$' }
                rowCount: { type: integer, minimum: 1, maximum: 200 }
                authorityDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
                policyDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
