openapi: 3.1.0
info:
  title: ProfitPilot Core API
  version: 0.1.0
  description: Contract-economics prototype API contract. Specification only; no server is deployed.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder only — not a live endpoint
security:
  - bearerAuth: []
paths:
  /me:
    get:
      summary: Resolve authenticated identity (membership discovery not exposed)
      responses:
        "200": { description: Verified identity only; membership discovery requires a separately reviewed endpoint. }
        "401": { description: Unauthenticated }
  /tenants/{tenantId}/contracts:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      summary: List contracts visible to the verified tenant member
      responses:
        "200": { description: Contract list }
        "403": { description: Tenant membership or role not authorised }
  /tenants/{tenantId}/imports:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Create an import batch from an authorised source file
      description: Membership and metadata are checked. The SHA-256 and permission reference are client declarations; original file bytes are not independently verified. Identical metadata retries are idempotent; conflicting metadata is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceType, fileName, sha256, permissionReference, periodStart, periodEnd]
              properties:
                sourceType: { type: string, enum: [payroll, customer_invoice, supplier_invoice] }
                fileName: { type: string, maxLength: 255 }
                sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
                permissionReference: { type: string, minLength: 1 }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
      responses:
        "201": { description: Batch created }
        "200": { description: Identical metadata replay; existing batch returned }
        "400": { description: Invalid metadata }
        "403": { description: Permission or role not sufficient }
        "409": { description: Conflicting duplicate or period }
  /tenants/{tenantId}/imports/{batchId}/file:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Verify and ingest original CSV bytes atomically
      description: Uncompressed UTF-8 CSV only, 512 KiB and 2000 rows maximum, exact allowlisted headers. Requires empty uploaded batch and SHA-256 match. Original bytes retained with runtime metadata-only read access. Digest is not proof of issuer identity.
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
      responses:
        "201": { description: Verified source receipt created }
        "200": { description: Identical file replay }
        "403": { description: Not authorised }
        "404": { description: Batch unavailable }
        "409": { description: Existing rows or closed batch }
        "413": { description: File too large }
        "415": { description: Unsupported format or encoding }
        "422": { description: Malformed CSV or checksum mismatch }
  /tenants/{tenantId}/imports/{batchId}/source:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    get:
      summary: Read source integrity receipt without original file contents
      responses:
        "200": { description: Byte-verified or client-declared status, issuer not authenticated }
        "404": { description: Batch unavailable }
  /tenants/{tenantId}/imports/{batchId}/rows:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Persist parsed invoice row objects for a source batch
      description: Accepts 1–200 contiguous JSON row objects per request, maximum 2000 per batch. Exact JSONB-equivalent replays are idempotent; differing overlaps or new rows after validation are rejected atomically. Client-side parsing only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                startRow: { type: integer, minimum: 1, maximum: 2000, default: 1 }
                rows: { type: array, minItems: 1, maxItems: 200, items: { type: object } }
      responses:
        "201": { description: New rows persisted }
        "200": { description: Exact row replay }
        "409": { description: Conflicting content, gap, or sealed batch }
        "400": { description: Invalid row payload }
        "403": { description: Not authorised }
        "404": { description: Batch not found }
  /tenants/{tenantId}/imports/{batchId}/validate:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Validate invoice or payroll source rows and produce held/review candidates
      responses:
        "200": { description: Structural validation results; existing human decisions preserved }
        "409": { description: Invalid batch state or inconsistent row numbering }
        "422": { description: No rows or unsupported source type }
        "403": { description: Not authorised }
        "404": { description: Batch not found in this tenant }
  /tenants/{tenantId}/imports/{batchId}/reconcile-payroll:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Human-confirm payroll against a reviewer-attested control total
      description: Owner, admin or reviewer only. Source rows require stable tenant-unique source_ref, decimal amount string, currency and exact batch period_start/period_end. Whole-row assignment remains supported; multiple distinct destinations require explicit decimal amount strings. Unassigned amounts remain unallocated. Database confirmation checks each source, line and bucket total.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [controlTotal, currency, controlReference, reason]
              properties:
                controlTotal: { type: string }
                currency: { type: string }
                controlReference: { type: string, maxLength: 200 }
                reason: { type: string, minLength: 3, maxLength: 2000 }
                assignments:
                  type: array
                  maxItems: 2000
                  items:
                    type: object
                    required: [rowNumber, bucket, reason]
                    properties:
                      rowNumber: { type: integer, minimum: 1 }
                      amount: { type: string, description: Positive decimal split amount; omit only for whole-row assignment }
                      bucket: { type: string, enum: [direct, approved_allocated, non_site, excluded] }
                      siteId: { type: string, format: uuid }
                      reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "201": { description: Pool, allocation run and source lineage created atomically }
        "403": { description: Reviewer role required }
        "404": { description: Batch unavailable }
        "409": { description: Duplicate source or batch already reconciled }
        "422": { description: Held source rows, invalid allocation or total mismatch }
  /tenants/{tenantId}/matches/{matchId}/decision:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: matchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Record a human invoice-match decision
      description: Candidate scores never auto-confirm a match. Append reviewer, reason and timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [confirmed, rejected, held] }
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        "201": { description: Decision appended }
        "403": { description: Reviewer role required }
        "409": { description: Match state changed; refresh required }
  /tenants/{tenantId}/calculations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Create a versioned contract/site/period calculation run
      description: Server calculates from immutable input versions; no client-supplied output totals are trusted.
      responses:
        "201": { description: Calculation run created }
        "422": { description: Insufficient or unreconciled source evidence }
  /tenants/{tenantId}/calculations/{runId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Retrieve immutable calculation output and coverage limitations
      responses:
        "200": { description: Calculation output }
        "404": { description: Run not found in this tenant }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, format: uuid }
