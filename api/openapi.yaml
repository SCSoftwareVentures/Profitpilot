openapi: 3.1.0
info:
  title: ProfitPilot Core API
  version: 0.1.0
  description: Contract-economics prototype API contract. Specification only; no server is deployed.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder only — not a live endpoint
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Operational liveness and database connectivity check
      security: []
      responses:
        "200": { description: API process and database are reachable }
        "503": { description: Database unavailable }
  /me:
    get:
      summary: Resolve authenticated identity (membership discovery not exposed)
      responses:
        "200":
          description: Verified identity only; membership discovery requires a separately reviewed endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityResponse' }
        "401": { description: Unauthenticated }
  /tenants/{tenantId}/contracts:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      summary: List contracts visible to the verified tenant member
      responses:
        "200":
          description: Contract list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ContractSummary' }
        "400": { description: Invalid tenant ID }
        "401": { description: Unauthenticated }
        "403": { description: Tenant membership not authorised }
  /tenants/{tenantId}/imports:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Register import metadata for an authorised source (no binary file is uploaded or stored)
      description: Records caller-supplied metadata and checksum only. It does not receive, verify or store file bytes; status is registered until a secure upload pipeline exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceType, fileName, sha256, permissionReference, periodStart, periodEnd]
              properties:
                sourceType: { type: string, enum: [payroll, customer_invoice, supplier_invoice] }
                fileName: { type: string, maxLength: 255 }
                sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
                permissionReference: { type: string, minLength: 1, maxLength: 256 }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
      responses:
        "201":
          description: Import metadata registered; no binary object stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportRegistrationResponse' }
        "200":
          description: Idempotent replay of identical import metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportRegistrationResponse' }
        "400": { description: Invalid metadata }
        "401": { description: Unauthenticated }
        "403": { description: Permission or role not sufficient }
        "409": { description: Conflicting duplicate metadata; existing source record is preserved }
  /tenants/{tenantId}/imports/{batchId}/rows:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Persist parsed invoice row objects for a source batch
      description: Accepts 1–200 privacy-screened invoice row objects per request. Unknown fields, nested values and suspicious identifiers reject the entire chunk before persistence. Invalid or missing financial fields that pass screening can be held for review. startRowNumber preserves original source row numbering across chunks. Identical retries are idempotent; conflicting content at an existing row number is rejected. This endpoint does not upload or store the original binary file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                startRowNumber: { type: integer, minimum: 1, maximum: 1000000000, default: 1 }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/InvoiceSourceRow'
      responses:
        "201":
          description: Parsed row objects persisted; identical retries are idempotently ignored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RowsIngestResponse' }
        "400": { description: Invalid row payload or source row number }
        "401": { description: Unauthenticated }
        "403": { description: Not authorised }
        "404": { description: Batch not found }
        "409": { description: Conflicting source row content at an existing row number }
        "413": { description: Request body exceeds the configured JSON payload limit }
        "422": { description: Unsafe invoice payload or disabled payroll ingestion; no rows are accepted }
  /tenants/{tenantId}/imports/{batchId}/validate:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Validate source rows and produce held/review candidates
      responses:
        "200":
          description: Invoice rows structurally validated into candidate/held states; no row is automatically accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationResponse' }
        "401": { description: Unauthenticated }
        "403": { description: Not authorised }
        "404": { description: Batch not found in this tenant }
        "422": { description: Payroll validation is not yet supported or no source rows exist }
  /tenants/{tenantId}/matches/{matchId}/decision:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: matchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Record a human invoice-match decision
      description: Candidate scores never auto-confirm a match. Append reviewer, reason and timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [confirmed, rejected, held] }
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        "201":
          description: Human decision recorded with reviewer and timestamp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchDecisionResponse' }
        "400": { description: Invalid decision or missing reason }
        "401": { description: Unauthenticated }
        "403": { description: Reviewer role required }
        "404": { description: Review candidate not found in this tenant or already finalised }
  /tenants/{tenantId}/calculations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Create a versioned contract/site/period calculation run
      description: Server calculates from immutable input versions; no client-supplied output totals are trusted. The approved contract version tax basis must be explicit and must match every confirmed invoice source basis; unknown or mixed tax basis is blocked.
      responses:
        "201":
          description: Incomplete management calculation run created with headline contribution and margin withheld
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalculationRunResponse' }
        "400": { description: Invalid period or request identifiers }
        "401": { description: Unauthenticated }
        "403": { description: Not authorised }
        "422": { description: Insufficient, incomparable or unreconciled source evidence }
  /tenants/{tenantId}/calculations/{runId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Retrieve immutable calculation output and coverage limitations
      responses:
        "200":
          description: Immutable calculation output and explicit completeness limitations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalculationRunRecord' }
        "401": { description: Unauthenticated }
        "403": { description: Tenant membership not authorised }
        "404": { description: Run not found in this tenant }
components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string, description: Stable machine-readable error code when supplied by the route }
        reference: { type: string, format: uuid, description: Correlation reference; no SQL, token or source payload is returned }
    IdentityResponse:
      type: object
      required: [subject, membershipsEndpoint]
      properties:
        subject: { type: string, maxLength: 255 }
        email: { type: [string, "null"] }
        membershipsEndpoint: { type: string }
    ContractSummary:
      type: object
      required: [id, customer_name, status]
      properties:
        id: { type: string, format: uuid }
        customer_name: { type: string }
        status: { type: string }
    MoneyDecimal:
      type: string
      maxLength: 16
      pattern: '^-?(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
      description: Exact decimal string only; no JSON number, exponent notation or implicit rounding. PostgreSQL numeric(14,2) bound.
      examples: ["1234.50", "-110.00", "0.00"]
    InvoiceSourceRow:
      type: object
      description: Only the listed business fields are accepted. Use opaque identifiers; no contact, tax-file, payment-card, banking, payroll or access-code data. Missing fields or safe placeholders may be held by financial validation. Conservative reference screening can reject legitimate numeric identifiers.
      properties:
        invoice_id: { type: string, maxLength: 128 }
        site: { type: string, maxLength: 160 }
        date: { type: string, maxLength: 32 }
        amount: { type: string, pattern: '^([+-]?[0-9]{1,12}([.][0-9]{1,2})?)?
    ImportRegistrationResponse:
      type: object
      required: [batch]
      properties:
        batch:
          type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [registered, review, validating, accepted, rejected, failed] }
        idempotent: { type: boolean }
    RowsIngestResponse:
      type: object
      required: [batchId, inserted, received, duplicates, startRowNumber]
      properties:
        batchId: { type: string, format: uuid }
        inserted: { type: integer, minimum: 0 }
        received: { type: integer, minimum: 1 }
        duplicates: { type: integer, minimum: 0 }
        startRowNumber: { type: integer, minimum: 1 }
    ValidationResponse:
      type: object
      required: [batchId, total, validCandidateRows, heldRows, automaticallyAccepted]
      properties:
        batchId: { type: string, format: uuid }
        total: { type: integer, minimum: 0 }
        validCandidateRows: { type: integer, minimum: 0 }
        heldRows: { type: integer, minimum: 0 }
        automaticallyAccepted: { const: 0 }
    MatchDecisionResponse:
      type: object
      required: [decision]
      properties:
        decision:
          type: object
          required: [id, decision, reviewed_at]
          properties:
            id: { type: string, format: uuid }
            decision: { type: string, enum: [confirmed, rejected, held] }
            reviewed_at: { type: string, format: date-time }
    CalculationOutputs:
      type: object
      required: [revenue, deliveryCost, contribution, marginPercent, indicativeContribution, currency, completeness, limitations]
      properties:
        revenue: { $ref: '#/components/schemas/MoneyDecimal' }
        deliveryCost: { $ref: '#/components/schemas/MoneyDecimal' }
        contribution: { type: [string, "null"], description: Always null while the source/cost model is incomplete }
        marginPercent: { type: [string, "null"], description: Always null while the source/cost model is incomplete }
        indicativeContribution: { $ref: '#/components/schemas/MoneyDecimal' }
        currency: { type: string, pattern: '^[A-Z]{3}
        completeness: { type: string, enum: [incomplete] }
        limitations: { type: array, items: { type: string } }
    CalculationRunResponse:
      type: object
      required: [id, createdAt, outputs]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        outputs: { $ref: '#/components/schemas/CalculationOutputs' }
    CalculationRunRecord:
      type: object
      required: [id, contract_id, site_id, period_start, period_end, formula_version, inputs, outputs, completeness, created_at]
      properties:
        id: { type: string, format: uuid }
        contract_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        formula_version: { type: string }
        inputs: { type: object }
        outputs: { $ref: '#/components/schemas/CalculationOutputs' }
        completeness: { type: string, enum: [incomplete] }
        created_at: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, format: uuid }
 }
        taxBasis: { type: string }
