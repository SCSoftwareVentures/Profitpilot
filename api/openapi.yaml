openapi: 3.1.0
info:
  title: ProfitPilot Core API
  version: 0.1.0
  description: Contract-economics prototype API contract. Specification only; no server is deployed.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder only — not a live endpoint
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Operational liveness and database connectivity check
      security: []
      responses:
        "200": { description: API process and database are reachable }
        "503": { description: Database unavailable }
  /me:
    get:
      summary: Resolve authenticated identity (membership discovery not exposed)
      responses:
        "200":
          description: Verified identity only; membership discovery requires a separately reviewed endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityResponse' }
        "401": { description: Unauthenticated }
  /tenants/{tenantId}/contracts:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      summary: List contracts visible to the verified tenant member
      description: Stable UUID-ordered keyset pagination; cursor is an exclusive lower bound within the authenticated tenant. No total count. Concurrent changes may affect subsequent pages.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Contract list
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/ContractSummary' }
                  nextCursor: { type: [string, 'null'], format: uuid, description: Exclusive cursor for the next page or null at the end }
        "400": { description: Invalid tenant ID }
        "401": { description: Unauthenticated }
        "403": { description: Tenant membership not authorised }
  /tenants/{tenantId}/imports:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Register import metadata for an authorised source (no binary file is uploaded or stored)
      description: Synthetic non-production only. Production import intake is blocked. Records caller-supplied metadata and checksum only. It does not receive, verify or store file bytes; status is registered until a secure upload pipeline exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceType, fileName, sha256, permissionReference, periodStart, periodEnd]
              properties:
                sourceType: { type: string, enum: [payroll, customer_invoice, supplier_invoice] }
                fileName: { type: string, maxLength: 255 }
                sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
                permissionReference: { type: string, minLength: 1, maxLength: 256 }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
      responses:
        "201":
          description: Import metadata registered; no binary object stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportRegistrationResponse' }
        "200":
          description: Idempotent replay of identical import metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportRegistrationResponse' }
        "400": { description: Invalid metadata }
        "401": { description: Unauthenticated }
        "403": { description: Permission or role not sufficient }
        "409": { description: Conflicting duplicate metadata; existing source record is preserved }
        "503": { description: Production intake not approved }
  /tenants/{tenantId}/imports/{batchId}/file:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Stage an encrypted file in private quarantine (synthetic non-production tests only)
      description: Disabled in production, pending scanner and lifecycle acceptance. Requires owner/admin and recent MFA. Raw uncompressed UTF-8 text/csv only, 1 to 65536 bytes. Must match registered SHA-256. No file retrieval or public link. A stored receipt means pending quarantine, not clean status.
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, format: binary }
      responses:
        "201": { description: Encrypted quarantine receipt; scan pending }
        "400": { description: Invalid text or upload size }
        "401": { description: Unauthenticated }
        "403": { description: Insufficient authority or recent MFA }
        "404": { description: Batch not found }
        "409": { description: File already exists }
        "413": { description: Upload exceeds 65536 bytes }
        "415": { description: Unsupported media type or compression }
        "422": { description: Checksum or batch eligibility mismatch }
        "429": { description: Quarantine quota or rate limit exceeded }
        "503": { description: Upload disabled or unavailable }
  /tenants/{tenantId}/imports/{batchId}/file/approve:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Approve scanned and validated quarantine manifest for processing
      description: Synthetic non-production only. Active owner/admin and recent MFA required. Approval does not expose file bytes or accept financial records. The isolated worker decrypts, rescans and checks the canonical manifest digest before atomic persistence. Holds, revoked account authority and targeted revocation of the approving session block processing.
      responses:
        "202": { description: Approved for isolated processing }
        "400": { description: Invalid approval request }
        "401": { description: Unauthenticated }
        "403": { description: Insufficient authority or recent MFA }
        "404": { description: Batch not found }
        "409": { description: Already approved or conflicting record }
        "422": { description: File not eligible }
        "503": { description: File processing disabled }
  /tenants/{tenantId}/imports/{batchId}/rows:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Persist parsed invoice row objects for a source batch
      description: Synthetic non-production only. Production import intake is blocked. Accepts 1–200 privacy-screened invoice row objects per request. Unknown fields, nested values and suspicious identifiers reject the entire chunk before persistence. Invalid or missing financial fields that pass screening can be held for review. startRowNumber preserves original source row numbering across chunks. Identical retries are idempotent; conflicting content at an existing row number is rejected. This endpoint does not upload or store the original binary file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                startRowNumber: { type: integer, minimum: 1, maximum: 1000000000, default: 1 }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/InvoiceSourceRow'
      responses:
        "201":
          description: Parsed row objects persisted; identical retries are idempotently ignored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RowsIngestResponse' }
        "400": { description: Invalid row payload or source row number }
        "401": { description: Unauthenticated }
        "403": { description: Not authorised }
        "404": { description: Batch not found }
        "409": { description: Conflicting source row content at an existing row number }
        "413": { description: Request body exceeds the configured JSON payload limit }
        "422": { description: Unsafe invoice payload or disabled payroll ingestion; no rows are accepted }
        "503": { description: Production intake not approved }

  /tenants/{tenantId}/imports/{batchId}/validate:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Validate source rows and produce held/review candidates
      description: Synthetic non-production only. Production import intake is blocked. Structural validation creates only new unreviewed proposals. Existing proposals and reviewed decisions remain unchanged. Structural counts describe validator results, not current review states.
      responses:
        "200":
          description: Invoice rows structurally validated into candidate/held states; no row is automatically accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationResponse' }
        "401": { description: Unauthenticated }
        "403": { description: Not authorised }
        "404": { description: Batch not found in this tenant }
        "422": { description: Payroll validation is not yet supported or no source rows exist }
        "503": { description: Production intake not approved }
  /tenants/{tenantId}/matches/{matchId}/decision:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: matchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Record a human invoice-match decision
      description: Candidate scores never auto-confirm a match. Append reviewer, reason and timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [confirmed, rejected, held] }
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        "201":
          description: Human decision recorded with reviewer and timestamp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchDecisionResponse' }
        "400": { description: Invalid decision or missing reason }
        "401": { description: Unauthenticated }
        "403": { description: Reviewer role required }
        "404": { description: Review candidate not found in this tenant or already finalised }
  /tenants/{tenantId}/calculations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Create a versioned contract/site/period calculation run
      description: Server calculates from immutable input versions; no client-supplied output totals are trusted. The approved contract version tax basis must be explicit and must match every confirmed invoice source basis; unknown or mixed tax basis is blocked.
      responses:
        "201":
          description: Incomplete management calculation run created with headline contribution and margin withheld
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalculationRunResponse' }
        "400": { description: Invalid period or request identifiers }
        "401": { description: Unauthenticated }
        "403": { description: Not authorised }
        "422": { description: Insufficient, incomparable or unreconciled source evidence }
  /tenants/{tenantId}/calculations/{runId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Retrieve an allowlisted immutable calculation summary, excluding stored inputs and arbitrary notes
      description: Access is audited and subject to shared per-identity and per-tenant financial read budgets.
      responses:
        "200":
          description: Minimized financial summary with explicit completeness limitations; raw payroll records and inputs are excluded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalculationRunRecord' }
        "401": { description: Unauthenticated }
        "403": { description: Tenant membership not authorised }
        "404": { description: Run not found in this tenant }
        "429": { description: Financial read quota exceeded }
  /tenants/{tenantId}/calculations/{runId}/export:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Export a single minimized management calculation
      description: Requires an active owner or admin and issuer-attested MFA within five minutes. Returns only allowlisted financial summary fields, enforces shared per-identity and tenant export budgets, records an audit event, and creates no persistent download file or public link. Incomplete results remain explicitly incomplete; authoritative contribution and margin are withheld.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose]
              properties:
                purpose: { type: string, enum: [internal_review, customer_reporting, accountant_review] }
      responses:
        "200":
          description: Audited JSON summary attachment with no-store cache control
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [exportId, calculationId, contractId, siteId, periodStart, periodEnd, completeness, currency, revenue, deliveryCost, indicativeContribution, contribution, marginPercent, notice]
                properties:
                  exportId: { type: string, format: uuid }
                  calculationId: { type: string, format: uuid }
                  contractId: { type: string, format: uuid }
                  siteId: { type: string, format: uuid }
                  periodStart: { type: string, format: date }
                  periodEnd: { type: string, format: date }
                  completeness: { type: string, enum: [complete, incomplete] }
                  currency: { type: [string, "null"] }
                  revenue: { type: [string, "null"] }
                  deliveryCost: { type: [string, "null"] }
                  indicativeContribution: { type: [string, "null"] }
                  contribution: { type: [string, "null"] }
                  marginPercent: { type: [string, "null"] }
                  notice: { type: string }
        "400": { description: Invalid identifier or export purpose }
        "401": { description: Unauthenticated }
        "403": { description: Insufficient role, tenant membership or recent MFA }
        "404": { description: Calculation unavailable in tenant }
        "429": { description: Rate limit exceeded }
  /tenants/{tenantId}/payroll/runs/{runId}/submit:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Submit a reconciled payroll run
      description: Synthetic candidate only. Active membership, appropriate role and fresh issuer-attested MFA required. Live routes remain locked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [submit], properties: { submit: { const: true } } }
      responses:
        "200": { description: Minimised operation result }
        "400": { description: Invalid request }
        "401": { description: Unauthenticated }
        "403": { description: Authority denied }
        "409": { description: Conflicting or stale evidence }
        "422": { description: Ineligible operation }
        "503": { description: Live processing closed or unavailable }
  /tenants/{tenantId}/payroll/proposals/{proposalId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: proposalId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read a minimised payroll proposal
      description: Synthetic candidate only. Active membership, appropriate role and fresh issuer-attested MFA required. Live routes remain locked.
      responses:
        "200": { description: Minimised operation result }
        "400": { description: Invalid request }
        "401": { description: Unauthenticated }
        "403": { description: Authority denied }
        "409": { description: Conflicting or stale evidence }
        "422": { description: Ineligible operation }
        "503": { description: Live processing closed or unavailable }
  /tenants/{tenantId}/payroll/proposals/{proposalId}/confirm:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: proposalId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Confirm the exact reviewed payroll digest
      description: Synthetic candidate only. Active membership, appropriate role and fresh issuer-attested MFA required. Live routes remain locked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [confirm, evidenceDigest], properties: { confirm: { const: true }, evidenceDigest: { type: string, pattern: '^[a-f0-9]{64}$' } } }
      responses:
        "200": { description: Minimised operation result }
        "400": { description: Invalid request }
        "401": { description: Unauthenticated }
        "403": { description: Authority denied }
        "409": { description: Conflicting or stale evidence }
        "422": { description: Ineligible operation }
        "503": { description: Live processing closed or unavailable }
  /tenants/{tenantId}/privacy/account:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      summary: Access own stored account and selected tenant membership
      description: Synthetic candidate only. Active membership, appropriate role and fresh issuer-attested MFA required. Live routes remain locked.
      responses:
        "200": { description: Minimised operation result }
        "400": { description: Invalid request }
        "401": { description: Unauthenticated }
        "403": { description: Authority denied }
        "409": { description: Conflicting or stale evidence }
        "422": { description: Ineligible operation }
        "503": { description: Live processing closed or unavailable }
  /tenants/{tenantId}/privacy/account/correct-email:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Correct own stored email from current verified issuer claim
      description: Synthetic candidate only. Active membership, appropriate role and fresh issuer-attested MFA required. Live routes remain locked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [confirm], properties: { confirm: { const: true } } }
      responses:
        "200": { description: Minimised operation result }
        "400": { description: Invalid request }
        "401": { description: Unauthenticated }
        "403": { description: Authority denied }
        "409": { description: Conflicting or stale evidence }
        "422": { description: Ineligible operation }
        "503": { description: Live processing closed or unavailable }
  /tenants/{tenantId}/privacy/invoices/{batchId}/disposal-preview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: batchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Preview eligible invoice staging disposal scope
      description: Synthetic candidate only. Active membership, appropriate role and fresh issuer-attested MFA required. Live routes remain locked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        "200": { description: Minimised operation result }
        "400": { description: Invalid request }
        "401": { description: Unauthenticated }
        "403": { description: Authority denied }
        "409": { description: Conflicting or stale evidence }
        "422": { description: Ineligible operation }
        "503": { description: Live processing closed or unavailable }
  /tenants/{tenantId}/privacy/invoices/{batchId}/disposals/{orderId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: batchId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: orderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Request, decide or consume exact scoped disposal authority
      description: Synthetic candidate only. Active membership, appropriate role and fresh issuer-attested MFA required. Live routes remain locked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [step, scopeDigest, confirm], properties: { step: { enum: [request, approve, reject, consume] }, scopeDigest: { type: string, pattern: '^[a-f0-9]{64}$' }, confirm: { const: true } } }
      responses:
        "200": { description: Minimised operation result }
        "400": { description: Invalid request }
        "401": { description: Unauthenticated }
        "403": { description: Authority denied }
        "409": { description: Conflicting or stale evidence }
        "422": { description: Ineligible operation }
        "503": { description: Live processing closed or unavailable }

  /tenants/{tenantId}/privacy/cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: caseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read minimised privacy case status
      description: Self-service case owner or authorised staff, fresh MFA. No response documents or personal-data export.
      responses:
        "200": { description: Case status and internal escalation target }
        "403": { description: Authority denied }
        "503": { description: Live processing closed or unavailable }
    post:
      summary: Record an explicit privacy rights case action
      description: Self request or staff-assisted verified intake, acknowledgement, independent evidenced outcome. No automatic disclosure, correction or erasure of other records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [action, confirm, kind]
                  properties:
                    action: { const: request }
                    confirm: { const: true }
                    kind: { enum: [access, correction, disposal, complaint] }
                - type: object
                  additionalProperties: false
                  required: [action, confirm, kind, evidenceDigest]
                  properties:
                    action: { const: intake }
                    confirm: { const: true }
                    kind: { enum: [access, correction, disposal, complaint] }
                    evidenceDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
                - type: object
                  additionalProperties: false
                  required: [action, confirm]
                  properties:
                    action: { const: acknowledge }
                    confirm: { const: true }
                - type: object
                  additionalProperties: false
                  required: [action, confirm, reasonCode, evidenceDigest]
                  properties:
                    action: { const: resolve }
                    confirm: { const: true }
                    reasonCode: { enum: [fulfilled, partially_fulfilled] }
                    evidenceDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
                - type: object
                  additionalProperties: false
                  required: [action, confirm, reasonCode, evidenceDigest]
                  properties:
                    action: { const: refuse }
                    confirm: { const: true }
                    reasonCode: { enum: [lawful_refusal, retention_required, identity_not_verified] }
                    evidenceDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        "200": { description: Minimised case status }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Authority denied }
        "409": { description: Conflicting state }
        "429": { description: Capacity reached, use assisted channel }
        "503": { description: Live processing closed or unavailable }


  /tenants/{tenantId}/payroll/runs/{runId}/correction-preview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Preview scoped payroll supersession
      description: Synthetic only. Owner/admin with recent MFA; independent source population verification is required outside the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proposalId, reason, authorityEvidenceDigest]
              properties:
                proposalId: { type: string, format: uuid }
                reason: { enum: [allocation_error, source_correction, duplicate_source, privacy_correction] }
                authorityEvidenceDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        "200": { description: Exact scope and proposal digest with original and proposed aggregate amounts }
        "400": { description: Invalid request }
        "403": { description: Authority denied }
        "409": { description: Evidence conflict }
        "429": { description: Access budget exceeded }
        "503": { description: Live processing closed or unavailable }
  /tenants/{tenantId}/payroll/corrections/{orderId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: orderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read scoped correction order status
      description: Owner/admin with fresh MFA. Status does not guarantee that authority is still valid; execution revalidates all evidence and approvals.
      responses:
        "200": { description: Minimised correction status and scope }
        "403": { description: Authority denied }
        "503": { description: Live processing closed or unavailable }
    post:
      summary: Request, decide or execute an exact payroll correction
      description: Separate proposal submitter, requesting operator and independent approver. Execution requires the reviewed replacement digest, fresh MFA and an approved unexpired one-use order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [oldRunId, proposalId, reason, authorityEvidenceDigest, scopeDigest, step, confirm]
              properties:
                oldRunId: { type: string, format: uuid }
                proposalId: { type: string, format: uuid }
                reason: { enum: [allocation_error, source_correction, duplicate_source, privacy_correction] }
                authorityEvidenceDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
                scopeDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
                step: { enum: [request, approve, reject, consume] }
                confirm: { const: true }
                proposalDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
              allOf:
                - if:
                    properties:
                      step: { const: consume }
                  then:
                    required: [proposalDigest]
                  else:
                    not:
                      required: [proposalDigest]
      responses:
        "200": { description: Correction status }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Authority denied or invalid scope }
        "409": { description: Conflicting state }
        "503": { description: Live processing closed or unavailable }

  /tenants/{tenantId}/privacy/cases/{caseId}/deliveries/{orderId}/preview:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: caseId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: orderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Preview exact privacy response scope
      description: Owner/admin with recent MFA. Candidate only; no response transport or release to a recipient.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipientType, recipientKeyDigest, senderKeyDigest, authorityDigest, redactionDigest, responseDigest, envelopeDigest]
              properties:
                recipientType: { enum: [self, assisted_subject, authorized_representative, former_user] }
                recipientKeyDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
                senderKeyDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
                authorityDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
                redactionDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
                responseDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
                envelopeDigest: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        "200": { description: Minimized scope or authorization status }
        "400": { description: Invalid request }
        "403": { description: Authority denied }
        "409": { description: Conflicting state }
        "503": { description: Live processing closed or unavailable }
