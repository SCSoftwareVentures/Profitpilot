  /tenants/{tenantId}/payroll/pools/{poolId}/allocations/{runId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: poolId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read minimized candidate allocation state
      responses:
        "200": { description: Candidate or confirmed state }
        "403": { description: Authority denied }
    post:
      summary: Materialize immutable candidate from reviewed payroll source
      description: Owner/admin with recent MFA. Synthetic only. Complete allocations require independent confirmation. Unassigned cents remain explicit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm, lines]
              properties:
                confirm: { const: true }
                lines:
                  type: array
                  maxItems: 400
                  items:
                    type: object
                    additionalProperties: false
                    required: [sourceRowKey, bucket, siteId, amount, evidenceRef]
                    properties:
                      sourceRowKey: { type: string, pattern: '^ppr_[a-f0-9]{64}$' }
                      bucket: { enum: [approved_allocated, non_site, excluded] }
                      siteId: { type: [string, 'null'], format: uuid }
                      amount: { type: string, pattern: '^(0|[1-9][0-9]{0,11})[.][0-9]{2}$' }
                      evidenceRef: { type: string, pattern: '^ev_[a-f0-9]{60}$' }
      responses:
        "200": { description: Immutable draft or independently reviewable proposal }
        "400": { description: Invalid mapping }
        "403": { description: Authority denied }
        "409": { description: Ineligible or conflicting source }
        "503": { description: Unavailable }

components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string, description: Stable machine-readable error code when supplied by the route }
        reference: { type: string, format: uuid, description: Correlation reference; no SQL, token or source payload is returned }
    IdentityResponse:
      type: object
      required: [subject, membershipsEndpoint]
      properties:
        subject: { type: string, maxLength: 255 }
        email: { type: [string, "null"] }
        membershipsEndpoint: { type: string }
    ContractSummary:
      type: object
      required: [id, customer_name, status]
      properties:
        id: { type: string, format: uuid }
        customer_name: { type: string }
        status: { type: string }
    MoneyDecimal:
      type: string
      maxLength: 16
      pattern: '^-?(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$'
      description: Exact decimal string only; no JSON number, exponent notation or implicit rounding. PostgreSQL numeric(14,2) bound.
      examples: ["1234.50", "-110.00", "0.00"]
    InvoiceSourceRow:
      type: object
      description: Use opaque business identifiers. Only approved invoice fields are accepted; no payroll, contact, tax-file, banking, payment-card or access-code values.
      additionalProperties: false
      properties:
        invoice_id: { type: string, maxLength: 128 }
        site: { type: string, maxLength: 160 }
        date: { type: string, maxLength: 32 }
        amount: { type: string, pattern: '^([+-]?[0-9]{1,12}([.][0-9]{1,2})?)?$' }
        customer_id: { type: string, maxLength: 128 }
        contract_id: { type: string, maxLength: 128 }
        site_id: { type: string, maxLength: 128 }
        service_period_start: { type: string, maxLength: 32 }
        service_period_end: { type: string, maxLength: 32 }
        currency: { type: string, pattern: '^([A-Z]{3})?$' }
        tax_basis: { type: string, enum: ['', gst_inclusive, gst_exclusive, no_gst, unknown] }
    ImportRegistrationResponse:
      type: object
      required: [batch]
      properties:
        batch:
          type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [registered, review, validating, accepted, rejected, failed] }
        idempotent: { type: boolean }
    RowsIngestResponse:
      type: object
      required: [batchId, inserted, received, duplicates, startRowNumber]
      properties:
        batchId: { type: string, format: uuid }
        inserted: { type: integer, minimum: 0 }
        received: { type: integer, minimum: 1 }
        duplicates: { type: integer, minimum: 0 }
        startRowNumber: { type: integer, minimum: 1 }
    ValidationResponse:
      type: object
      required: [batchId, total, validCandidateRows, heldRows, newProposals, preservedProposals, automaticallyAccepted]
      properties:
        batchId: { type: string, format: uuid }
        total: { type: integer, minimum: 0 }
        validCandidateRows: { type: integer, minimum: 0 }
        heldRows: { type: integer, minimum: 0 }
        newProposals: { type: integer, minimum: 0 }
        preservedProposals: { type: integer, minimum: 0 }
        automaticallyAccepted: { const: 0 }
    MatchDecisionResponse:
      type: object
      required: [decision]
      properties:
        decision:
          type: object
          required: [id, decision, reviewed_at]
          properties:
            id: { type: string, format: uuid }
            decision: { type: string, enum: [confirmed, rejected, held] }
            reviewed_at: { type: string, format: date-time }
    CalculationOutputs:
      type: object
      required: [revenue, deliveryCost, contribution, marginPercent, indicativeContribution, currency, completeness, limitations]
      properties:
        revenue: { $ref: '#/components/schemas/MoneyDecimal' }
        deliveryCost: { $ref: '#/components/schemas/MoneyDecimal' }
        contribution: { type: [string, "null"] }
        marginPercent: { type: [string, "null"] }
        indicativeContribution: { $ref: '#/components/schemas/MoneyDecimal' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        taxBasis: { type: string }
        invoiceLineCount: { type: integer, minimum: 0 }
        allocationLineCount: { type: integer, minimum: 0 }
        taxBasisCount: { type: integer, minimum: 0 }
        completeness: { type: string, enum: [incomplete] }
        limitations: { type: array, items: { type: string } }
    CalculationRunResponse:
      type: object
      required: [id, createdAt, outputs]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        outputs: { $ref: '#/components/schemas/CalculationOutputs' }
    CalculationRunRecord:
      type: object
      additionalProperties: false
      required: [id, contract_id, site_id, period_start, period_end, formula_version, outputs, completeness, created_at]
      properties:
        id: { type: string, format: uuid }
        contract_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        formula_version: { type: [string, "null"] }
        outputs:
          type: object
          additionalProperties: false
          required: [revenue, deliveryCost, indicativeContribution, contribution, marginPercent, currency, completeness, limitations]
          properties:
            revenue: { type: [string, "null"] }
            deliveryCost: { type: [string, "null"] }
            indicativeContribution: { type: [string, "null"] }
            contribution: { type: [string, "null"] }
            marginPercent: { type: [string, "null"] }
            currency: { type: [string, "null"] }
            completeness: { type: string, enum: [complete, incomplete] }
            limitations: { type: array, items: { type: string } }
        completeness: { type: string, enum: [complete, incomplete] }
        created_at: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, format: uuid }
