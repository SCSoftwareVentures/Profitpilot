openapi: 3.1.0
info:
  title: ProfitPilot Core API
  version: 0.1.0
  description: Contract-economics prototype API contract. Specification only; no server is deployed.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder only — not a live endpoint
security:
  - bearerAuth: []
paths:
  /me:
    get:
      summary: Resolve authenticated identity (membership discovery not exposed)
      responses:
        "200": { description: Verified identity only; membership discovery requires a separately reviewed endpoint. }
        "401": { description: Unauthenticated }
  /tenants/{tenantId}/contracts:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      summary: List contracts visible to the verified tenant member
      responses:
        "200": { description: Contract list }
        "403": { description: Tenant membership or role not authorised }
  /tenants/{tenantId}/imports:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Create an import batch from an authorised source file
      description: Server must verify membership, permission basis, file checksum, limits and idempotency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceType, fileName, sha256, permissionReference, periodStart, periodEnd]
              properties:
                sourceType: { type: string, enum: [payroll, customer_invoice, supplier_invoice] }
                fileName: { type: string, maxLength: 255 }
                sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
                permissionReference: { type: string, minLength: 1 }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
      responses:
        "201": { description: Batch created or idempotent existing batch returned }
        "400": { description: Invalid metadata }
        "403": { description: Permission or role not sufficient }
        "409": { description: Conflicting duplicate or period }
  /tenants/{tenantId}/imports/{batchId}/rows:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Persist parsed invoice row objects for a source batch
      description: Accepts 1–200 JSON row objects per request. Client-side parsing only; raw file upload/storage is not implemented.
      responses:
        "201": { description: Rows persisted; duplicates are idempotently ignored }
        "400": { description: Invalid row payload }
        "403": { description: Not authorised }
        "404": { description: Batch not found }
  /tenants/{tenantId}/imports/{batchId}/validate:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
      summary: Validate source rows and produce held/review candidates
      responses:
        "202": { description: Invoice rows structurally validated into candidate/held states; payroll validation is not yet supported }
        "403": { description: Not authorised }
        "404": { description: Batch not found in this tenant }
  /tenants/{tenantId}/matches/{matchId}/decision:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: matchId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Record a human invoice-match decision
      description: Candidate scores never auto-confirm a match. Append reviewer, reason and timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [confirmed, rejected, held] }
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        "201": { description: Decision appended }
        "403": { description: Reviewer role required }
        "409": { description: Match state changed; refresh required }
  /tenants/{tenantId}/calculations:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Create a versioned contract/site/period calculation run
      description: Server calculates from immutable input versions; no client-supplied output totals are trusted.
      responses:
        "201": { description: Calculation run created }
        "422": { description: Insufficient or unreconciled source evidence }
  /tenants/{tenantId}/calculations/{runId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Retrieve immutable calculation output and coverage limitations
      responses:
        "200": { description: Calculation output }
        "404": { description: Run not found in this tenant }
  /me/security:
    get:
      summary: Inspect current authentication assurance and session context
      responses:
        "200": { description: Current authentication configuration and session assurance metadata }
  /me/sessions:
    get:
      summary: List active and recently revoked sessions for the authenticated identity
      responses:
        "200": { description: Session identifiers, issue/expiry/last-seen and revocation timestamps }
  /me/sessions/{jti}:
    parameters:
      - name: jti
        in: path
        required: true
        schema: { type: string, minLength: 16, maxLength: 128 }
    delete:
      summary: Revoke one session belonging to the authenticated identity
      responses:
        "200": { description: Session revoked }
        "404": { description: Session not found or not owned by identity }
  /tenants/{tenantId}/security/permissions:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      summary: Read tenant permission catalogue and member overrides
      responses:
        "200": { description: Permission catalogue and tenant-scoped overrides }
        "403": { description: Security permission not granted }
  /tenants/{tenantId}/security/permissions/overrides:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      summary: Grant or deny a non-security permission for a tenant member
      description: Requires tenant permission and fresh step-up authentication. Every change requires a reason and is written to the append-only audit chain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, permissionKey, effect, reason]
              properties:
                userId: { type: string, format: uuid }
                permissionKey: { type: string, maxLength: 128 }
                effect: { type: string, enum: [grant, deny] }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        "201": { description: Permission override recorded }
        "400": { description: Invalid override }
        "403": { description: Not authorised or step-up authentication required }
        "404": { description: Active member not found }
  /tenants/{tenantId}/security/permissions/overrides/{userId}/{permissionKey}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: permissionKey
        in: path
        required: true
        schema: { type: string, maxLength: 128 }
    delete:
      summary: Remove a tenant member permission override
      description: Requires fresh step-up authentication and a reason; security and privacy permissions cannot be overridden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        "200": { description: Override removed }
        "403": { description: Not authorised or step-up authentication required }
        "404": { description: Override not found }
  /tenants/{tenantId}/security/audit:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      summary: Retrieve recent tenant audit events and verify the audit hash chain
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200": { description: Audit entries and chain-integrity verification result }
        "403": { description: Audit read permission not granted }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, format: uuid }
