    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, format: uuid }
 }
                evidenceReference: { type: string, minLength: 3, maxLength: 500 }
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        "201": { description: Reservation created with audit event }
        "200": { description: Identical reviewer replay }
        "400": { description: Invalid request }
        "403": { description: Reviewer role required }
        "404": { description: Batch unavailable }
        "409": { description: Conflicting source or identity reservation }
        "422": { description: Source not eligible for review reservation }
  /tenants/{tenantId}/imports/{batchId}/reconcile-payroll:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/BatchId'
    post:
